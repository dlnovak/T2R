<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4eee0;--ink:#2a251e;--muted:#786f62;--line:#e4d9c3;--panel:#fffdf8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;
  background-image:radial-gradient(circle at 1px 1px,rgba(120,100,60,.12) 1px,transparent 0);background-size:22px 22px}
main{max-width:860px;margin:0 auto;padding:44px 18px 60px}
header{margin-bottom:28px}
.kicker{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#b2342b}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(40px,9vw,64px);line-height:1;margin:8px 0 10px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:16px;max-width:460px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.game{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 4px 14px rgba(60,40,10,.06);transition:transform .15s ease,box-shadow .15s ease}
.game:hover,.game:focus-visible{transform:translateY(-3px);box-shadow:0 12px 28px rgba(60,40,10,.14);outline:none}
.game:focus-visible{box-shadow:0 0 0 3px #b2342b,0 12px 28px rgba(60,40,10,.14)}
.art{height:150px;display:block}
.art svg{width:100%;height:100%;display:block}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;margin:0}
.info p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tags span{font-size:12px;font-weight:650;background:#f3ead6;border-radius:999px;padding:3px 9px;color:#5c5246}
footer{margin-top:36px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <div class="kicker">Board games</div>
    <h1>Game Night</h1>
    <p>Pick a game to play.</p>
  </header>
  <div class="grid" id="games"></div>
  <footer>More games coming soon.</footer>
</main>
<script>
// To add a game: put it in its own folder with an index.html, then add an entry here.
const GAMES=[
  {path:'ticket-to-ride/',title:'Ticket to Ride',blurb:'Claim train routes across North America and connect your secret destinations.',tags:['2–5 players','Online or same device'],
   art:`<svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2843"/><stop offset=".6" stop-color="#2c3c63"/><stop offset="1" stop-color="#5a2a2a"/></linearGradient></defs>
   <rect width="300" height="150" fill="url(#t)"/>
   <g fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="16 5">
   <path d="M30 110 L110 60" stroke="#d9473b"/><path d="M110 60 L190 85" stroke="#f2c14e"/><path d="M190 85 L270 40" stroke="#4f9d69"/><path d="M110 60 L150 25" stroke="#e9e1cf"/><path d="M190 85 L230 125" stroke="#4a7fd1"/></g>
   <g fill="#fff3d6" stroke="#1d2843" stroke-width="2.5"><circle cx="30" cy="110" r="7"/><circle cx="110" cy="60" r="7"/><circle cx="190" cy="85" r="7"/><circle cx="270" cy="40" r="7"/><circle cx="150" cy="25" r="7"/><circle cx="230" cy="125" r="7"/></g></svg>`},
  {path:'go-stop/',title:'Go-Stop',blurb:'Korean flower-card game (화투). Match cards by month and decide when to Go or Stop.',tags:['1 player vs. computer','Hwatu cards'],
   art:`<svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice"><rect width="300" height="150" fill="#4a5030"/>
   <g stroke="rgba(0,0,0,.08)">${Array.from({length:50},(_,i)=>`<line x1="0" y1="${i*3}" x2="300" y2="${i*3}"/>`).join('')}</g>
   <g transform="translate(150 82)">
   <g transform="rotate(-16) translate(-62 -42)"><rect width="56" height="84" rx="5" fill="#f7f0dd" stroke="#d6312a" stroke-width="3"/><circle cx="28" cy="30" r="13" fill="#d6312a"/><path d="M6 70 Q28 50 50 70 L50 80 L6 80Z" fill="#2f331d"/></g>
   <g transform="translate(-28 -48)"><rect width="56" height="84" rx="5" fill="#f7f0dd" stroke="#d6312a" stroke-width="3"/><rect x="20" y="10" width="16" height="58" rx="2" fill="#d6312a"/><circle cx="12" cy="74" r="5" fill="#d6312a"/><circle cx="44" cy="74" r="5" fill="#d6312a"/></g>
   <g transform="rotate(16) translate(6 -42)"><rect width="56" height="84" rx="5" fill="#f7f0dd" stroke="#d6312a" stroke-width="3"/><path d="M28 14 C10 30 10 50 28 70 C46 50 46 30 28 14Z" fill="#7c3b8f"/><path d="M28 70 L28 80" stroke="#2f331d" stroke-width="3"/></g></g>
   <text x="40" y="40" font-family="serif" font-size="26" fill="#e9bb4f">花</text></svg>`},
];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('games').innerHTML=GAMES.map(g=>`<a class="game" href="${g.path}">
  <span class="art" aria-hidden="true">${g.art}</span>
  <span class="info"><h2>${esc(g.title)}</h2><p>${esc(g.blurb)}</p><span class="tags">${g.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</span></span></a>`).join('');
</script>
</body>
</html>
