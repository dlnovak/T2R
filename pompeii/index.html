<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Downfall of Pompeii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:wght@400;500;700&family=Alegreya:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  /* Fresco night: Pompeian red and ochre on volcanic black; the board is a painted plan of the walled city */
  --night:#130d0c; --panel:#211614; --fresco:#9b2d20; --ochre:#d9a43a; --plaster:#f1e5c9; --ash:#a1968e; --ink:#25180f;
  --line:rgba(217,164,58,.32);
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'Alegreya Sans', 'Gill Sans', system-ui, sans-serif;
  --flavor:'Alegreya', Georgia, serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);background-image:radial-gradient(120% 60% at 15% -10%, rgba(155,45,32,.45), transparent 60%),radial-gradient(80% 50% at 100% 0%, rgba(217,164,58,.10), transparent 60%);color:var(--plaster);font-family:var(--body);font-size:16px;line-height:1.4}
button{font:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
h1{font-family:var(--display);font-weight:900;font-size:1.35rem;letter-spacing:.06em;margin:0;color:var(--ochre);text-wrap:balance}
h1 small{display:block;font-weight:500;font-size:.62rem;letter-spacing:.22em;color:var(--ash)}
.chip{font-family:var(--display);font-size:.72rem;letter-spacing:.12em;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--plaster);background:rgba(155,45,32,.35)}
.spacer{flex:1}
.btn{background:transparent;color:var(--plaster);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.85rem}
.btn:hover{border-color:var(--ochre)}
.btn.primary{background:var(--fresco);border-color:#c5503d;color:#fff;font-weight:700}
.btn.primary:hover{background:#b23726}
.layout{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.layout>*{min-width:0}
.mountain{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.mountain svg{width:92px;height:56px;flex:0 0 auto}
.mt-title{font-family:var(--display);font-size:.75rem;letter-spacing:.14em;color:var(--ochre)}
.mt-counts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:3px;font-variant-numeric:tabular-nums}
.mt-counts span{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid #000}
.boardwrap{margin-top:10px;background:#1b1210;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:inset 0 0 0 4px #2a1c18}
#board{display:block;width:100%;height:auto;max-width:640px;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#board .hit{fill:transparent;cursor:pointer}
#board .hl{fill:rgba(255,215,106,.28);stroke:#ffd76a;stroke-width:2.2;pointer-events:none;animation:hl 1.1s ease-in-out infinite alternate}
@keyframes hl{from{fill-opacity:.25;stroke-opacity:.6}to{fill-opacity:.7;stroke-opacity:1}}
#board .glow{animation:glow 1.6s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{from{opacity:0}to{opacity:.32}}
#board .plume{transform-box:fill-box;transform-origin:50% 100%;animation:plume 4s ease-in-out infinite alternate}
@keyframes plume{to{transform:scale(1.08,1.15)}}
#board .vglow{animation:vpulse 1.4s ease-in-out infinite alternate}
@keyframes vpulse{from{opacity:.45}to{opacity:1}}
#board .ash{animation:ash 3.6s linear infinite}
@keyframes ash{from{transform:translate(0,0);opacity:1}to{transform:translate(-30px,95px);opacity:0}}
#board .fresh{animation:fresh 1.2s ease-out 1}
@keyframes fresh{from{opacity:.9}to{opacity:0}}
.promptbar{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;background:linear-gradient(90deg,rgba(155,45,32,.35),rgba(33,22,20,.9));border:1px solid var(--line);border-radius:12px;min-height:58px}
#prompt{flex:1;font-size:.95rem}
#prompt b{color:var(--ochre)}
#actions{display:flex;gap:8px}
.tile{display:inline-block;width:42px;height:42px;flex:0 0 auto;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px #000,0 0 14px rgba(255,120,40,.55)}
.tile svg{width:100%;height:100%;display:block}
.section-h{font-family:var(--display);font-size:.78rem;letter-spacing:.16em;color:var(--ochre);margin:16px 0 6px}
.hand{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 14px;scroll-snap-type:x proximity}
.hand .card{scroll-snap-align:start}
.hand-note{color:var(--ash);font-size:.88rem;padding:6px 0}
/* ---------- Cards ---------- */
.card{font-size:10px;width:13em;flex:0 0 auto;background:linear-gradient(170deg,#f6edd6,#e6d5b1);color:var(--ink);border-radius:.8em;border:1px solid #6b4e33;box-shadow:0 .35em .9em rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;position:relative;text-align:left;padding:0;transition:transform .15s ease, box-shadow .15s ease}
.card.big{font-size:18px;cursor:default}
.hand .card{cursor:pointer}
.card.sel{transform:translateY(-.6em);box-shadow:0 0 0 .25em var(--ochre),0 .8em 1.4em rgba(0,0,0,.6)}
.card.dim{opacity:.55}
.cband{background:var(--bc);display:flex;justify-content:space-between;align-items:center;padding:.35em .6em .3em;border-bottom:1px solid rgba(0,0,0,.35);gap:.4em}
.cnum{font-family:var(--display);font-weight:900;font-size:1.9em;line-height:1;color:var(--ink)}
.ckind{font-family:var(--display);font-size:.75em;letter-spacing:.14em;font-weight:700;color:rgba(37,24,15,.8)}
.cpips{display:flex;gap:.2em}
.cpips i{width:.75em;height:.75em;border-radius:50%;background:var(--ink);display:block;box-shadow:inset 0 0 0 .14em #f6edd6}
.cart{margin:.45em .5em .2em;border-radius:.4em;background:radial-gradient(120% 90% at 50% 10%, #fbf4e2, #e9d8b5);border:1px solid rgba(107,78,51,.35)}
.cart svg{display:block;width:100%;height:auto}
.cname{font-family:var(--display);font-weight:700;font-size:1.15em;line-height:1.1;padding:.15em .6em 0;text-wrap:balance}
.clatin{font-family:var(--flavor);font-style:italic;font-size:.95em;color:#7a5634;padding:0 .6em}
.cfact{font-size:.93em;line-height:1.3;padding:.35em .6em .2em;margin:0;flex:1}
.cfoot{display:flex;justify-content:space-between;align-items:flex-end;padding:.25em .6em .55em;font-family:var(--display);font-size:.8em;font-weight:700;letter-spacing:.06em;color:#5b3f27}
.cfoot svg{width:5.6em;height:3.9em;border:1px solid rgba(0,0,0,.35);border-radius:.2em}
.ceffect{margin:.2em .6em .6em;padding:.45em .55em;border:1px solid rgba(37,24,15,.45);border-radius:.35em;background:rgba(255,255,255,.35);font-size:.92em;line-height:1.3;font-weight:500}
.ceffect b{font-family:var(--display);font-size:.85em;letter-spacing:.08em;display:block;color:var(--fresco)}
.pcard{background:linear-gradient(170deg,#ece1cf,#d5c3a6)}
.pcard .cband{background:#2c1b2b;color:var(--ochre)}
.pcard .cnum,.pcard .ckind{color:var(--ochre)}
.pcard .cart{background:radial-gradient(120% 90% at 50% 10%, #4a3446, #241522)}
.ecard{background:linear-gradient(170deg,#f3dcc0,#dcae86)}
.ecard .cband{background:linear-gradient(90deg,#7a140a,#d2501a)}
.ecard .cnum,.ecard .ckind{color:#ffe2a8}
.ecard .cart{background:radial-gradient(120% 90% at 50% 10%, #3b1a12, #120806)}
.cdate{font-family:var(--flavor);font-style:italic;font-size:.9em;color:#7a3d1c;padding:0 .6em}
/* ---------- Side panel ---------- */
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.houses{display:flex;flex-direction:column;gap:6px}
.house{display:grid;grid-template-columns:14px 1fr auto;gap:4px 10px;align-items:center;padding:7px 8px;border-radius:8px;border:1px solid transparent}
.house.cur{border-color:var(--pc);background:rgba(255,255,255,.04)}
.house .sw{width:14px;height:14px;border-radius:50%;background:var(--pc);border:2px solid #000}
.house .nm{font-family:var(--display);font-weight:700;font-size:.9rem}
.house .nm small{font-family:var(--body);font-weight:500;color:var(--ash);font-size:.75rem;margin-left:6px}
.house .st{grid-column:2/4;display:flex;gap:12px;font-size:.78rem;color:var(--ash);font-variant-numeric:tabular-nums}
.house .st b{color:var(--plaster)}
.house .esc{font-family:var(--display);font-weight:900;font-size:1.2rem;color:var(--pc);font-variant-numeric:tabular-nums}
#log{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;font-size:.85rem}
#log li{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}
#log li.ev{color:var(--ochre);font-family:var(--display);font-size:.78rem;letter-spacing:.06em}
.hn{color:var(--pc);font-weight:700}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.legend div{display:flex;align-items:center;gap:6px;font-size:.78rem}
.legend .tile{width:30px;height:30px;box-shadow:0 0 0 1px #000}
.legend b{font-family:var(--display);font-size:.78rem;display:block}
.legend span span{color:var(--ash);font-size:.72rem}
/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(8,4,3,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:calc(100% - 8px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox.cardbox{background:transparent;border:0;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:12px;width:auto}
.mbox h2{font-family:var(--display);color:var(--ochre);margin:0 0 8px;font-size:1.3rem;text-wrap:balance}
.mbox h3{font-family:var(--display);color:var(--ochre);font-size:.9rem;letter-spacing:.1em;margin:16px 0 4px}
.mbox p,.mbox li{font-size:.95rem}
.mbox ul{padding-left:18px;margin:4px 0}
.drawnby{font-size:.9rem;color:var(--ash)}
.setup-row{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ash);padding:6px 12px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--fresco);color:#fff;font-weight:700}
.setup-row.off{opacity:.35}
.result{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.result .rk{font-family:var(--display);font-weight:900;color:var(--ochre)}
/* ---------- Narrow screens: stacked, page scrolls ---------- */
.toprow,.bottomrow,.panelcol{display:flex;flex-direction:column;gap:12px}
.panelcol{margin-top:12px}
.housepanel .houses{display:grid;grid-template-columns:1fr;gap:4px}
/* ---------- Wide screens (16:9 and similar): everything on one screen ---------- */
@media (min-width:900px) and (min-aspect-ratio:5/4){
  html,body{height:100%;overflow:hidden}
  body{font-size:clamp(12px,1.45vh,16px)}
  #app{height:100%;max-width:none;display:flex;flex-direction:column;padding:8px 16px 12px}
  header{padding:0 0 6px;margin-bottom:8px;flex-wrap:nowrap}
  h1{font-size:1.25rem}
  h1 small{display:inline;margin-left:10px}
  .layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,61fr) minmax(0,39fr);gap:14px;align-items:stretch}
  .boardcol{min-height:0;display:flex;align-items:flex-start}
  .boardwrap{width:100%;max-height:100%;margin:0;padding:4px;display:flex;align-items:center;justify-content:center}
  #board{width:100%;height:auto;max-height:calc(100vh - 80px);max-width:100%}
  .panelcol{margin:0;min-height:0;gap:8px}
  .toprow{flex-direction:row;align-items:stretch;gap:8px}
  .mountain{flex-direction:column;justify-content:center;text-align:center;padding:6px 10px;gap:4px;flex:0 0 auto}
  .mountain svg{width:8.5vh;height:5.2vh}
  .mt-counts{justify-content:center}
  .housepanel{flex:1;padding:6px 8px}
  .housepanel .houses{grid-template-columns:1fr 1fr}
  .house{padding:4px 6px;gap:1px 8px}
  .house .st{gap:8px;font-size:.78em;flex-wrap:wrap}
  .house .nm small{font-size:.7em}
  .house .nm small .tr{display:none}
  .promptbar{margin:0;min-height:0;padding:7px 10px}
  .handwrap{flex:0 0 auto}
  .handwrap .section-h{margin:0 0 2px}
  .hand{overflow:visible;padding:6px 2px 8px;gap:1.2vh}
  .hand .card{font-size:clamp(6px,min(1.22vh,.56vw),13px)}
  .hand .discard .card{font-size:clamp(5px,.78vh,8px)}
  .hand-note{max-width:60ch}
  .bottomrow{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:8px}
  .bottomrow .panel{min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:6px 10px}
  .legend{gap:4px 8px}
  .legend .tile{width:3vh;height:3vh}
  #log{flex:1;max-height:none;min-height:0;font-size:.82em}
  .section-h{font-size:.72em}
}
.tabs{display:flex;margin:4px 0 12px;width:100%}
.tabs button{flex:1}
.err{color:#ff8a7a;font-size:.88rem;min-height:1.2em}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.lbl{display:block;font-family:var(--display);font-size:.8rem;letter-spacing:.1em;color:var(--ochre);margin-bottom:4px}
.codein{font-family:var(--display);font-size:1.6rem;letter-spacing:.3em;text-transform:uppercase;width:100%;max-width:240px;padding:8px 12px;background:#140d0c;color:var(--plaster);border:1px solid var(--line);border-radius:8px}
.codein:focus{outline:2px solid var(--ochre)}
.roomcode{font-family:var(--display);font-weight:900;font-size:2.6rem;letter-spacing:.3em;color:var(--ochre);text-align:center;padding:10px;margin:8px 0;border:1px dashed var(--line);border-radius:10px;background:#140d0c}
.btn:disabled{opacity:.4;cursor:not-allowed}
.cfoot .spaces{display:flex;gap:.35em;flex-wrap:wrap;align-items:flex-end}
.grp{display:inline-flex;gap:.15em;padding:.15em .2em;border:1px solid rgba(37,24,15,.4);border-radius:.3em}
.grp i{width:.7em;height:.7em;border-radius:50%;background:#f6efe0;border:.12em solid var(--ink);display:block}
.card .cnum{color:var(--bd)}
.wild{font-family:var(--display);font-weight:900;font-size:.8em;letter-spacing:.1em;color:#fff;background:#9b2d20;border-radius:.3em;padding:.1em .4em}
.discard{display:flex;flex-direction:column;gap:4px;align-items:flex-start;margin-left:8px;padding-left:12px;border-left:1px dashed var(--line);font-family:var(--display);font-size:.7rem;letter-spacing:.1em;color:var(--ash)}
.card.small{font-size:7px}
.hand .discard .card{font-size:6px}
.hand .discard .card.small{font-size:clamp(5px,.75vh,8px);cursor:default}
.card.empty{display:flex;align-items:center;justify-content:center;min-height:14em;background:transparent;border:1px dashed var(--line);color:var(--ash);box-shadow:none}
.chk{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:.9rem;color:var(--plaster)}
.chk input{width:18px;height:18px;accent-color:var(--fresco)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>The Downfall of Pompeii<small>AD 79</small></h1>
    <span class="chip" id="phase">Settling the city</span>
    <span class="chip" id="pile">Draw pile</span>
    <span class="spacer"></span>
    <a class="btn" href="../" style="text-decoration:none">← Game table</a>
    <button class="btn" id="rulesBtn">How to play</button>
    <button class="btn" id="newBtn">New game</button>
  </header>
  <div class="layout">
    <div class="boardcol"><div class="boardwrap"><svg id="board" viewBox="-12 -92 544 466" role="img" aria-label="Map of Pompeii and the countryside around its walls"></svg></div></div>
    <div class="panelcol">
      <div class="toprow">
        <div class="mountain" id="mountain"></div>
        <div class="panel housepanel"><div class="houses" id="houses"></div></div>
      </div>
      <div class="promptbar"><span id="tileSlot"></span><div id="prompt">Choose your households to begin.</div><div id="actions"></div></div>
      <div class="handwrap">
        <div class="section-h" id="handTitle">Your hand</div>
        <div class="hand" id="hand"></div>
      </div>
      <div class="bottomrow">
        <div class="panel"><div class="section-h" style="margin-top:0">The six vents</div><div class="legend" id="legend"></div></div>
        <div class="panel logpanel"><div class="section-h" style="margin-top:0">Chronicle</div><ol id="log"></ol></div>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="modal" hidden></div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
'use strict';
/* ================= Board data =================
   Rules follow the published rulebook (The Downfall of Pompeii, 2nd English edition).
   Board art and the exact positions of buildings on this map are original.
   Values marked [EST] could not be read clearly from the photos and are best estimates. */
const N = 13, NR = 9, CS = 40;   // 11 x 7 city squares, plus a ring for the gates
const K = (c, r) => c + ',' + r;
const P = k => k.split(',').map(Number);
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
/* Squares inside the board's grid that lie outside the city wall */
const OUTSIDE = new Set(['9,1','10,1','11,1','11,2','1,7','2,7','3,7']);
const interior = (c, r) => c >= 1 && c <= 11 && r >= 1 && r <= 7 && !OUTSIDE.has(c + ',' + r);
const INK = '#2b1d14', COL = '#f3e8cc';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function hash(c, r) { return ((c * 73856093) ^ (r * 19349663)) >>> 0; }

const HOUSES = [
  {gens:'Umbricii', m:'Umbricius', f:'Umbricia', color:'#d63a2c', light:'#ff8a7a', trade:'garum makers'},
  {gens:'Caecilii', m:'Caecilius', f:'Caecilia', color:'#2f67c8', light:'#8fb4ff', trade:'bankers'},
  {gens:'Popidii',  m:'Popidius',  f:'Popidia',  color:'#e2ae1c', light:'#ffd862', trade:'old nobility'},
  {gens:'Holconii', m:'Holconius', f:'Holconia', color:'#22a17a', light:'#6fe0bb', trade:'wine growers'},
];
const PRAE = ['Gaius','Lucius','Marcus','Publius','Quintus','Titus','Aulus','Decimus','Gnaeus','Sextus','Numerius','Spurius','Gaius','Lucius','Marcus'];
const COGF = ['Prima','Secunda','Tertia','Maxima','Paulla','Rufa','Iusta','Fortunata','Felicula','Quarta','Quinta','Secundilla','Prisca','Vera','Lucilla'];

const GATES = [
  {id:1, name:'Porta Ercolano', c:0,  r:1},
  {id:2, name:'Porta Vesuvio',  c:6,  r:0},
  {id:3, name:'Porta di Nola',  c:10, r:1},
  {id:4, name:'Porta di Sarno', c:12, r:5},
  {id:5, name:'Porta Nocera',   c:9,  r:8},
  {id:6, name:'Porta di Stabia',c:7,  r:8},
  {id:7, name:'Porta Marina',   c:0,  r:5},
];
const GATE_BY_KEY = new Map();
GATES.forEach(g => {
  g.k = K(g.c, g.r);
  const [dc, dr] = DIRS.find(([dc, dr]) => interior(g.c + dc, g.r + dr)); g.inner = K(g.c + dc, g.r + dr);
  g.dir = [dc, dr];                                   // direction from the gate into the city
  g.rot = dr === 1 ? 0 : dr === -1 ? 180 : dc === 1 ? -90 : 90;
  GATE_BY_KEY.set(g.k, g);
});
const ROAD = new Set();

/* The 4 building colours of the game */
const BCOL = {
  gray:   {name:'Gray',      hex:'#a7b0bb', deep:'#56606c', roof:'#8d97a3'},
  purple: {name:'Purple',    hex:'#9c7cc0', deep:'#4f3273', roof:'#7b559f'},
  turq:   {name:'Turquoise', hex:'#62b3ae', deep:'#1d625e', roof:'#2f948f'},
  brown:  {name:'Brown',     hex:'#b88a64', deep:'#5c3a20', roof:'#8e5d38'},
};
/* 11 numbered buildings. Buildings 3, 4, 6, 8, 10 and 11 have two parts (rulebook p.4).
   cells: [col, row, spaces]. One Pompeii card exists per space (rulebook p.4).
   Space counts per building part checked against the board picture in the rulebook PDF (53 in total). */
const BUILD = [
  {n:1,  color:'gray',   icon:'forum',   name:'Forum', parts:[{name:'Forum', cells:[[1,2,2],[2,2,2]]}],

/* ================= State ================= */
let S = null, RUN = 0;
let NET = {mode:'local'};
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function newState(cfg, opts = {}) {
  const n = cfg.length, pool = n === 4 ? 25 : 30;
  const players = cfg.map(c => ({...HOUSES[c.house], hi:c.house, ai:c.ai, remote:!!c.remote, hand:[], escaped:0, lost:0}));
  const cits = []; let id = 0;
  players.forEach((p, pi) => { for (let i = 0; i < pool; i++) cits.push({id:id++, p:pi, state:'home', k:null, name: i % 2 ? `${p.f} ${COGF[i % COGF.length]}` : `${PRAE[i % PRAE.length]} ${p.m}`}); });
  // Draw deck exactly as the rulebook (p.3)
  const pomp = shuffle(BUILD.flatMap(b => Array.from({length:b.total}, () => ({type:'pompeii', b:b.n}))));
  const piles = []; for (let i = 0; i < 7; i++) piles.push(pomp.splice(0, 4));
  const po = shuffle(pomp.concat(OMENS.map((_, i) => ({type:'omen', o:i}))));
  const bottom = shuffle(po.splice(0, n === 4 ? 10 : 15).concat([{type:'ad79'}]));
  const deck = piles[0].concat(piles[1], [{type:'ad79'}], po, bottom);
  players.forEach((p, i) => p.hand = piles[2 + i]);
  const bag = [].concat(...SYMS.map(s => Array.from({length:s.count}, () => ({sym:s.id}))));
  if (opts.dual) DUALS.forEach(d => bag.push({dual:d}));
  return {players, cits, deck, discard:null, bag:shuffle(bag), lava:new Map(), phase:'place', stirred:false, adSeen:0,
    cur:Math.floor(Math.random() * n), pick:null, tile:null, fresh:null, log:[], over:false, pool, dual:!!opts.dual, lavaPlaced:0};
}
const citsAt = k => S.cits.filter(c => c.state === 'board' && c.k === k);
const boardCits = () => S.cits.filter(c => c.state === 'board');
const homeCount = pi => S.cits.filter(c => c.p === pi && c.state === 'home').length;
const hn = pi => `<span class="hn" style="--pc:${S.players[pi].light}">${S.players[pi].gens}</span>`;
const cn = c => `<span class="hn" style="--pc:${S.players[c.p].light}">${c.name}</span>`;
const placeName = k => { const i = CELLINFO.get(k); return !i ? 'an open square' : i.neutral ? 'a neutral house' : `${i.part.name} (${i.b.n})`; };
const manh = (a, b) => { const [x1,y1] = P(a), [x2,y2] = P(b); return Math.abs(x1-x2) + Math.abs(y1-y2); };
function log(html, ev) { S.log.unshift({html, ev}); if (S.log.length > 150) S.log.pop(); }
const freeAt = k => capAt(k) - citsAt(k).length;

/* ================= Rules: phase 1 ================= */
function buildingFreeCells(b) { return b.parts.flatMap(pt => pt.keys).filter(k => freeAt(k) > 0 && !S.lava.has(k)); }
function anyFreeCells() { return [...CELLINFO.keys()].filter(k => freeAt(k) > 0 && !S.lava.has(k)); }
function cardOption(pi, card) {
  const b = BY_NUM.get(card.b);
  if (!homeCount(pi)) return {cells:[], wild:false, none:true};
  const own = buildingFreeCells(b);
  if (own.length) return {cells:own, wild:false};
  return {cells:anyFreeCells(), wild:true};
}
const partPieces = pt => pt.keys.reduce((a, k) => a + citsAt(k).length, 0);
/* Relatives may go to: a different building of the same colour, the other part of the same building, or a neutral building.
   Never the same part as the original piece; at most 1 relative per building (and per neutral building) in one move. */
function relativeTargets(origPart, used) {
  return [...CELLINFO.keys()].filter(k => {
    if (freeAt(k) <= 0 || S.lava.has(k)) return false;
    const i = CELLINFO.get(k);
    if (i.neutral) return !used.has(i.id);
    if (i.part === origPart) return false;
    if (used.has('b' + i.b.n)) return false;
    return i.b.color === origPart.b.color;
  });
}
function allWild(pi) { const p = S.players[pi]; return p.hand.length > 0 && homeCount(pi) > 0 && p.hand.every(c => !buildingFreeCells(BY_NUM.get(c.b)).length); }

/* ================= Rules: lava and movement ================= */
const passable = k => { const [c, r] = P(k); return interior(c, r) && !S.lava.has(k) && !VENT_AT.has(k); };
function distMap(extra) {
  const ok = k => passable(k) && k !== extra; const d = new Map(), q = [];
  for (const g of GATES) { if (!ok(g.inner) || d.has(g.inner)) continue; d.set(g.inner, 1); q.push(g.inner); }
  while (q.length) { const u = q.shift(); const [c,r] = P(u);
    for (const [dc,dr] of DIRS) { const nk = K(c+dc, r+dr); if (!ok(nk) || d.has(nk)) continue; d.set(nk, d.get(u) + 1); q.push(nk); } }
  return d;
}
/* Move points = number of pieces (any colour) on the starting square. Orthogonal only, no going back over a square.
   Leaving through a gate costs 1 point. */
function reachable(k) {
  const pts = citsAt(k).length; const seen = new Map([[k, 0]]), q = [k], out = new Map();
  while (q.length) { const u = q.shift(), du = seen.get(u); if (du >= pts) continue; const [c,r] = P(u);
    for (const [dc,dr] of DIRS) { const nk = K(c+dc, r+dr);
      if (GATE_BY_KEY.has(nk)) { if (!out.has(nk)) out.set(nk, du + 1); continue; }
      if (!passable(nk) || seen.has(nk)) continue;
      seen.set(nk, du + 1); out.set(nk, du + 1); q.push(nk); } }
  return out;
}
function lavaTargets(sym) {
  const mine = [...S.lava].filter(([, s]) => s === sym).map(([k]) => k);
  const o = SYM[sym].origin;
  if (!mine.length) return S.lava.has(o) ? [] : [o];
  const out = new Set();
  for (const m of mine) { const [c, r] = P(m); for (const [dc, dr] of DIRS) { const nk = K(c+dc, r+dr), [x, y] = P(nk);
    if (interior(x, y) && !S.lava.has(nk) && !VENT_AT.has(nk)) out.add(nk); } }
  return [...out];
}
function kill(c, how, by) {
  c.state = 'lost'; S.players[c.p].lost++;
  const t = {lava:`is buried by lava on ${placeName(c.k)}`, blocked:`is cut off from every gate and thrown into the volcano`, omen:`is thrown into the volcano by the ${by != null ? S.players[by].gens : 'gods'}`, end:`is still in the city when the last lava falls`}[how];
  log(`${cn(c)} ${t}.`);
}
function removeBlocked() { const d = distMap(); boardCits().filter(c => !d.has(c.k)).forEach(c => kill(c, 'blocked')); }
function placeLava(k, sym, pi) {
  S.lava.set(k, sym); S.fresh = k; S.lavaPlaced++;
  log(`${hn(pi)} place a ${SYM[sym].name} lava tile${VENT_AT.has(k) ? ' on its first lava square' : ''}.`);
  citsAt(k).forEach(c => kill(c, 'lava')); removeBlocked();
}

/* ================= Async plumbing ================= */
function guard(p) { const my = RUN; return p.then(v => my === RUN ? v : new Promise(() => {})); }
const sleep = ms => guard(new Promise(r => setTimeout(r, REDUCED ? ms * .4 : ms * (window.BOTSPEED || 1))));
function setPrompt(html) { S.prompt = html; renderPrompt(); }
/* Every choice a player makes goes through pick(). Specs are plain data so they can be sent to an online player. */
function pick(spec) {
  spec.prompt = S.prompt;
  if (NET.mode === 'host' && S.players[spec.pi].remote) {
    const seat = spec.pi;
    return guard(new Promise(res => {
      NET.pending.set(seat, res); NET.pendingSpec.set(seat, spec);
      sendTo(seat, {t:'pick', spec});
      setPrompt(`Waiting for the ${hn(seat)}…`); render();
    }));
  }
  return guard(new Promise(res => { S.pick = {...spec, sel:null, selCid:null, resolve: v => { S.pick = null; res(v); render(); }}; render(); }));
}
function showModal(html, btnLabel = 'Continue') {
  return guard(new Promise(res => {
    const m = document.getElementById('modal'); m.innerHTML = html + (btnLabel ? `<button class="btn primary" id="mOk">${btnLabel}</button>` : '');
    m.hidden = false; const ok = document.getElementById('mOk');
    if (ok) { ok.focus(); ok.onclick = () => { m.hidden = true; m.innerHTML = ''; res(true); }; }
  }));
}
function showLocalCard(html, label, cb) {
  const m = document.getElementById('modal');
  m.innerHTML = html + `<button class="btn primary" id="mOk2">${label}</button></div>`; m.hidden = false;
  document.getElementById('mOk2').onclick = () => { m.hidden = true; m.innerHTML = ''; if (cb) cb(); };
}
function showCard(card, pi) {
  const html = `<div class="mbox cardbox">${cardHTML(card, 'big')}<div class="drawnby">Drawn by the ${hn(pi)}</div>`;
  if (NET.mode === 'host') {
    flushBroadcast();
    for (const [, conn] of NET.conns) conn.send({t:'card', html, pi});
    if (S.players[pi].remote) { showLocalCard(html, 'Close'); return guard(new Promise(res => NET.acks.set(pi, res))); }
  }
  if (window.AUTOCARDS) return sleep(50);
  return showModal(html, 'Continue');
}

/* ---- Static scenery (countryside, trees), generated once ---- */
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
/* Board drawing area: city grid is 520 x 360; countryside margin around it */
const VB = {x:-12, y:-92, w:544, h:466};
const ROADS_OUT = GATES.map(g => {

  const L = Math.abs(far) + 10, bend = (g.id % 2 ? 1 : -1) * 26;

});

    const vert = h > w; for (let t = 6; t < (vert ? w : h); t += 6) s += vert ? `<path d="M${x + t} ${y + 4} v${h - 8}" stroke="#6f8a3e" stroke-width="2" stroke-dasharray="3 2"/>` : `<path d="M${x + 4} ${y + t} h${w - 8}" stroke="#6f8a3e" stroke-width="2" stroke-dasharray="3 2"/>`;

    if (R() < .5) s += `<ellipse cx="${x + 2}" cy="${y + 5}" rx="3" ry="2" fill="rgba(0,0,0,.25)"/><ellipse cx="${x}" cy="${y}" rx="2.6" ry="7" fill="#2f5a34" stroke="#1f3f24" stroke-width=".7"/>`;

  for (let t = 0; t <= w; t += step) s += `<circle cx="${x + t}" cy="${y}" r="1.3" fill="#f6efe0" stroke="#6b5a45" stroke-width=".5"/><circle cx="${x + t}" cy="${y + h}" r="1.3" fill="#f6efe0" stroke="#6b5a45" stroke-width=".5"/>`;
  for (let t = step; t < h; t += step) s += `<circle cx="${x}" cy="${y + t}" r="1.3" fill="#f6efe0" stroke="#6b5a45" stroke-width=".5"/><circle cx="${x + w}" cy="${y + t}" r="1.3" fill="#f6efe0" stroke="#6b5a45" stroke-width=".5"/>`;

/* ================= Game loop ================= */
async function gameLoop() {
  const n = S.players.length; let lastHuman = -1;
  const humans = S.players.filter(p => !p.ai).length;
  log(`The citizens of Pompeii begin their daily work. The ${S.players[S.cur].gens} play first.`, true); render();
  const handoff = async pi => {
    const p = S.players[pi];
    if (NET.mode === 'local' && !p.ai && humans > 1 && lastHuman !== pi) {
      S.handoff = true; render();
      await showModal(`<div class="mbox"><h2>Pass to the ${p.gens}</h2><p>Hand the device to the player of the ${hn(pi)}. Other players look away.</p>`, `I am the ${p.gens}`);
      S.handoff = false; lastHuman = pi;
    }
  };
  // Phase 1
  let trigger = null;
  while (S.phase === 'place') {
    const pi = S.cur; await handoff(pi);
    if (S.players[pi].ai) setPrompt(`The ${hn(pi)} are deciding…`);
    trigger = await placeTurn(pi);
    render();
    if (trigger != null) break;
    S.cur = (S.cur + 1) % n;
  }
  // Vesuvius erupts: 6 lava tiles, starting with the left-hand neighbour of the player who triggered it
  S.phase = 'erupting'; S.players.forEach(p => p.hand = []);
  S.cits.filter(c => c.state === 'home').forEach(c => c.state = 'out');
  log('Vesuvius erupts! Hands and unplaced pieces go back in the box.', true);
  let q = (trigger + 1) % n;
  while (S.lavaPlaced < 6 && S.bag.length) { await handoff(q); await lavaStep(q); if (S.lavaPlaced >= 6) break; q = (q + 1) % n; }
  // Phase 2: left-hand neighbour of the player who placed the 6th tile begins
  S.phase = 'flight'; S.cur = (q + 1) % n;
  log('Run for your lives! The flight from Pompeii begins.', true); render();
  while (!S.over) {
    if (!boardCits().length) { S.over = true; break; }
    const pi = S.cur; await handoff(pi);
    if (S.players[pi].ai) setPrompt(`The ${hn(pi)} are deciding…`);
    await flightTurn(pi); render();
    if (!S.bag.length || !boardCits().length) {
      if (boardCits().length) { log('The last lava tile has been drawn. Everyone still in the city is lost.', true); boardCits().forEach(c => kill(c, 'end')); }
      S.over = true;
    }
    S.cur = (S.cur + 1) % n;
  }
  S.phase = 'over'; S.tile = null; render(); gameOver();
}

/* One turn of phase 1. Returns the seat that triggered the eruption, or null. */
async function placeTurn(pi) {
  const p = S.players[pi];
  const opts = p.hand.map(c => cardOption(pi, c));
  const canErupt = allWild(pi);
  let ch;
  if (p.ai) { await sleep(700); ch = aiPlacement(pi, opts, canErupt); }
  else {
    const home = homeCount(pi);
    setPrompt(!home ? 'All your pieces are in the city. Tap a card to discard it.'
      : `Your turn. Tap a card, then a <b>glowing space</b> in that building.${opts.some(o => o.wild) ? ' A card marked WILD can go in any free space in any building.' : ''}`);
    ch = await pick({kind:'place', pi, cardOpts:opts.map(o => ({cells:o.cells, wild:o.wild})), buttons: canErupt ? [{label:'The volcano erupts!', value:'erupt'}] : []});
  }
  if (ch === 'erupt') {
    log(`${hn(pi)} have only wild cards and call out: "The volcano erupts!"`, true);
    await showModal(`<div class="mbox"><h2>"The volcano erupts!"</h2><p>The ${hn(pi)} show their hand: every card is for a building that is already full. The eruption begins now.</p><div class="row-btns" style="margin:10px 0">${p.hand.map(c => cardHTML(c, '', true)).join('')}</div>`);
    return pi;
  }
  const card = p.hand.splice(ch.idx, 1)[0], b = BY_NUM.get(card.b), o = opts[ch.idx];
  S.discard = card;
  if (ch.k == null) log(`${hn(pi)} discard a ${b.n} card.`);
  else {
    const info = CELLINFO.get(ch.k), part = info.neutral ? null : info.part;
    const before = (!o.wild && part) ? partPieces(part) : 0;
    const c = S.cits.find(x => x.p === pi && x.state === 'home'); c.state = 'board'; c.k = ch.k;
    log(`${cn(c)} moves into ${placeName(ch.k)}${o.wild ? ' (wild card)' : ''}.`);
    render();
    // Relatives (only after the first AD 79 card, never from a wild card)
    if (!S.stirred && !o.wild && before > 0) log(`No relatives yet: they only come after the first AD 79 card is drawn.`);
    if (S.stirred && !o.wild && before > 0) {
      const used = new Set(); let placed = 0;
      for (let i = 0; i < before && homeCount(pi); i++) {
        const cells = relativeTargets(part, used); if (!cells.length) break;
        let k;
        if (p.ai) { await sleep(420); k = aiRelative(pi, cells); }
        else {
          setPrompt(`<b>Relatives:</b> ${before} ${before === 1 ? 'piece was' : 'pieces were'} already in ${part.name}, so you may place ${before - i} more: in another ${BCOL[b.color].name.toLowerCase()} building, the other part of this one, or a neutral house. One per building.`);
          k = await pick({kind:'cell', pi, cells, buttons:[{label:'Skip the rest', value:'skip'}]});
        }
        if (k === 'skip' || k == null) break;
        used.add(bidOf(k));
        const r = S.cits.find(x => x.p === pi && x.state === 'home'); r.state = 'board'; r.k = k; placed++;
        log(`Relative ${cn(r)} moves into ${placeName(k)}.`); render();
      }
    }
  }
  // Draw back up to 4 cards
  while (S.deck.length) {
    const c = S.deck.shift();
    if (c.type === 'pompeii') { p.hand.push(c); break; }
    if (c.type === 'ad79') {
      S.adSeen++;
      if (S.adSeen === 1) { await showCard({type:'ad79', second:false}, pi); S.stirred = true; log('AD 79: Vesuvius seethes. Omens and Relatives now apply.', true); render(); continue; }
      await showCard({type:'ad79', second:true}, pi); return pi;
    }
    if (c.type === 'omen') {
      S.discard = c;
      await showCard(c, pi);
      const targets = boardCits().filter(x => x.p !== pi);
      if (!targets.length) { log(`${OMENS[c.o].title}: no rival piece is in the city.`, true); continue; }
      let k;
      if (p.ai) { await sleep(500); k = aiOmen(pi, targets); }
      else { setPrompt(`<b>Omen!</b> Tap a rival's piece to throw it into the volcano.`); k = await pick({kind:'cell', pi, cells:[...new Set(targets.map(x => x.k))], buttons:[]}); }
      const victims = citsAt(k).filter(x => x.p !== pi), owners = [...new Set(victims.map(x => x.p))];
      let owner = owners[0];
      if (owners.length > 1) {
        if (p.ai) owner = owners.sort((a, b) => (S.players[b].escaped + boardCits().filter(x => x.p === b).length) - (S.players[a].escaped + boardCits().filter(x => x.p === a).length))[0];
        else { setPrompt('Whose piece goes into the volcano?'); owner = await pick({kind:'choice', pi, buttons:owners.map(o => ({label:S.players[o].gens, value:o}))}); }
      }
      kill(victims.find(x => x.p === owner), 'omen', pi); render(); continue;
    }
  }
  return null;
}

async function lavaStep(pi) {
  const p = S.players[pi]; if (!S.bag.length) return;
  const t = S.bag.shift(); S.tile = {t, pi}; render();
  let sym = t.sym;
  if (t.dual) {
    const opts = t.dual.filter(s => lavaTargets(s).length);
    if (!opts.length) sym = t.dual[0];
    else if (opts.length === 1) sym = opts[0];
    else if (p.ai) { await sleep(500); sym = aiDual(pi, opts); }
    else { setPrompt('You drew a <b>dual vent</b> tile. Choose which side to play.'); sym = await pick({kind:'choice', pi, buttons:opts.map(s => ({label:SYM[s].name, value:s}))}); }
  }
  const cells = lavaTargets(sym);
  if (!cells.length) { log(`The ${SYM[sym].name} flow has nowhere to go. The tile is set aside.`); await sleep(600); S.tile = null; return; }
  let k;
  if (p.ai) { setPrompt(`The ${hn(pi)} drew a <b>${SYM[sym].name}</b> lava tile.`); await sleep(800); k = aiLava(pi, sym, cells); }
  else { setPrompt(`You drew a <b>${SYM[sym].name}</b> lava tile. Place it on a glowing square${[...S.lava.values()].includes(sym) ? `, next to another ${SYM[sym].name} tile` : ', its first lava square'}.`); k = await pick({kind:'cell', pi, cells, buttons:[]}); }
  placeLava(k, sym, pi); S.tile = null; render(); await sleep(300);
}

/* Which pieces may move now, and where. Rulebook p.7 including both exceptions. */
function movables(pi, moved, aloneAtStart) {
  const mine = boardCits().filter(c => c.p === pi), out = {};
  for (const c of mine) {
    if (moved.length === 1 && moved[0] === c.id && !(aloneAtStart.has(c.id) || mine.length === 1)) continue;
    const d = [...reachable(c.k).keys()]; if (d.length) out[c.id] = d;
  }
  return out;
}
async function flightTurn(pi) {
  const p = S.players[pi];
  await lavaStep(pi);
  const mine = () => boardCits().filter(c => c.p === pi);
  if (!mine().length) { log(`${hn(pi)} have no one left in the city and only place lava.`); await sleep(250); return; }
  const aloneAtStart = new Set(mine().filter(c => citsAt(c.k).length === 1).map(c => c.id));
  const moved = [];
  for (let m = 0; m < 2; m++) {
    const mv = movables(pi, moved, aloneAtStart);
    if (!Object.keys(mv).length) break;
    let ch;
    if (p.ai) { await sleep(650); ch = aiMove(pi, mv); if (!ch) break; }
    else {
      setPrompt(`${m === 0 ? 'Move up to 2 pieces.' : 'Move a second piece, or end your turn.'} Tap one of your pieces, then a glowing square. A piece moves 1 square for each piece on its square; a gate costs 1.`);
      ch = await pick({kind:'move', pi, movables:mv, buttons:[{label:'End turn', value:null}]}); if (!ch) break;
    }
    const c = S.cits.find(x => x.id === ch.cid);
    const g = GATE_BY_KEY.get(ch.dest), pts = citsAt(c.k).length;
    if (g) { c.state = 'escaped'; c.k = null; p.escaped++; log(`${cn(c)} escapes through the <b>${g.name}</b> (${pts} move point${pts > 1 ? 's' : ''}).`); }
    else { c.k = ch.dest; log(`${hn(pi)} move ${cn(c)} (${pts} move point${pts > 1 ? 's' : ''}).`); }
    moved.push(c.id); S.fresh = null; render();
  }
}

/* ================= Computer players ================= */
function threatAt(k, front) { let m = 99; for (const f of front) m = Math.min(m, manh(k, f)); return Math.max(0, 4 - m) + (front.has(k) ? 3 : 0); }
function frontier() { const f = new Set(); SYMS.forEach(s => lavaTargets(s.id).forEach(k => f.add(k))); return f; }
function ventNear(k) { let t = 0; SYMS.forEach(s => t += Math.max(0, 3 - manh(k, s.origin))); return t; }
function placeScore(k, d) { return 12 - (d.get(k) ?? 15) * 1.1 + citsAt(k).length * .9 - ventNear(k) * 1.3 + Math.random(); }
function aiPlacement(pi, opts, canErupt) {
  const p = S.players[pi], d = distMap();
  if (canErupt) { const mineN = boardCits().filter(c => c.p === pi).length; const best = Math.max(...S.players.map((_, j) => j === pi ? 0 : boardCits().filter(c => c.p === j).length)); if (mineN >= best) return 'erupt'; }
  let best = null;
  opts.forEach((o, idx) => {
    if (o.none || !o.cells.length) { const sc = -50 + Math.random(); if (!best || sc > best.sc) best = {sc, idx, k:null}; return; }
    for (const k of o.cells) {
      let sc = placeScore(k, d) - (o.wild ? .5 : 0);
      const i = CELLINFO.get(k);
      if (S.stirred && !o.wild && !i.neutral) sc += Math.min(partPieces(i.part), homeCount(pi) - 1) * 2.6;
      if (!best || sc > best.sc) best = {sc, idx, k};
    }
  });
  return best;
}
function aiRelative(pi, cells) { const d = distMap(); let best = null; for (const k of cells) { const sc = placeScore(k, d); if (!best || sc > best.sc) best = {sc, k}; } return best.k; }
function aiOmen(pi, targets) {
  const d = distMap(); let best = null;
  for (const c of targets) { const strength = S.players[c.p].escaped + boardCits().filter(x => x.p === c.p).length;
    const sc = 15 - (d.get(c.k) ?? 15) + strength * .4 + citsAt(c.k).length * .5 + Math.random() * 2; if (!best || sc > best.sc) best = {sc, k:c.k}; }
  return best.k;
}
function lavaScore(pi, k) {
  const base = distMap(), d2 = distMap(k); let sc = Math.random() * .8;
  for (const c of boardCits()) { const w = c.p !== pi ? 1 : -1.4;
    if (c.k === k) { sc += w * 10; continue; }
    if (!d2.has(c.k)) { sc += w * 8; continue; }
    sc += w * (d2.get(c.k) - (base.get(c.k) ?? d2.get(c.k))) * 1.5;
    const m = manh(c.k, k); if (m <= 2) sc += w * (3 - m) * .8; }
  return sc;
}
function aiLava(pi, sym, cells) { let best = null; for (const k of cells) { const sc = lavaScore(pi, k); if (!best || sc > best.sc) best = {sc, k}; } return best.k; }
function aiDual(pi, syms) { let best = null; for (const s of syms) for (const k of lavaTargets(s)) { const sc = lavaScore(pi, k); if (!best || sc > best.sc) best = {sc, s}; } return best.s; }
function aiMove(pi, mv) {
  const d = distMap(), front = frontier(); let best = null;
  for (const [cid, dests] of Object.entries(mv)) {
    const c = S.cits.find(x => x.id === +cid), here = d.get(c.k) ?? 99, thr = threatAt(c.k, front);
    for (const dest of dests) {
      let sc;
      if (GATE_BY_KEY.has(dest)) sc = 100 + thr * 3;
      else sc = (here - (d.get(dest) ?? 99)) * 3 + thr * 2 - threatAt(dest, front) * 2.5 + citsAt(dest).length * .7;
      sc += Math.random() * .3;
      if (!best || sc > best.sc) best = {sc, cid:+cid, dest};
    }
  }
  return best && best.sc > .5 ? {cid:best.cid, dest:best.dest} : null;
}

document.getElementById('board').addEventListener('click', e => {
  const t = e.target.closest('[data-k]'); if (!t || !S) return; const k = t.dataset.k, pk = S.pick;
  if (pk) {
    if (pk.kind === 'cell' && pk.cells.includes(k)) return pk.resolve(k);
    if (pk.kind === 'place' && pk.sel != null && pk.cardOpts[pk.sel].cells.includes(k)) return pk.resolve({idx:pk.sel, k});
    if (pk.kind === 'move') {
      if (pk.selCid != null && (pk.movables[pk.selCid] || []).includes(k)) return pk.resolve({cid:pk.selCid, dest:k});
      const mine = citsAt(k).filter(c => pk.movables[c.id]);
      if (mine.length) { pk.selCid = pk.selCid != null && mine.some(c => c.id === pk.selCid) ? null : mine[0].id; render(); return; }
      if (pk.selCid != null) { pk.selCid = null; render(); return; }
    }
  }
  const info = CELLINFO.get(k);
  if (info && !info.neutral && (!pk || (pk.kind === 'place' && pk.sel == null))) showInfo(buildingCard(info.b, '', 'big'));
  else if (GATE_BY_KEY.has(k) && !pk) showInfo(`<div class="mbox"><h2>${GATE_BY_KEY.get(k).name}</h2><p>One of the seven city gates. Moving through a gate costs 1 move point and the piece is saved. A gate is closed once lava covers the square inside it.</p></div>`);
  else if (VENT_AT.has(k) && !pk) { const v = VENT_AT.get(k); showInfo(`<div class="mbox"><h2>First lava square: ${v.name}</h2><p>The first ${v.name} tile goes here. Until then, nobody may move onto this square.</p></div>`); }
});
function handPick(i) {
  const pk = S.pick;
  if (pk && pk.kind === 'place') {
    if (!pk.cardOpts[i].cells.length) return pk.resolve({idx:i, k:null});
    pk.sel = pk.sel === i ? null : i; render();
  } else { const v = viewer(); if (v >= 0) showInfo(buildingCard(BY_NUM.get(S.players[v].hand[i].b), '', 'big')); }
}
document.getElementById('hand').addEventListener('click', e => { const c = e.target.closest('.card[data-idx]'); if (c) handPick(+c.dataset.idx); });
document.getElementById('hand').addEventListener('keydown', e => { const c = e.target.closest('.card[data-idx]'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); handPick(+c.dataset.idx); } });
function showInfo(inner) {

/* ================= Rules reference ================= */
const RULES = `<h2>How to play</h2>
<p>Pompeii, AD 79. In phase 1 you bring as many of your people into the city as you can. When Vesuvius erupts, you try to get them out through the seven gates before the lava covers everything. Whoever saves the most wins.</p>
<h3>SETUP</h3>
<ul><li>2–3 players: 30 pieces each. 4 players: 25 each. Each player starts with a 4-card hand.</li>
<li>The deck: 8 Pompeii cards, then the first AD 79 card, then the rest of the Pompeii and Omen cards with the second AD 79 shuffled into the bottom 10 (4 players) or 15 (2–3 players).</li></ul>
<h3>PHASE 1 · NEW CITIZENS</h3>
<ul><li>On your turn: play 1 card, put 1 piece on a free space in the building with that number (either part of a two-part building), then draw.</li>
<li>Each card shows its building's spaces, which is also how many cards of that number exist.</li>
<li><b>Wild card:</b> if every space of the card's building is taken, place your piece on any free space in any building. Wild placements never bring relatives.</li>
<li><b>First AD 79:</b> draw a replacement card. From now on:</li>
<li><b>Omens:</b> when you draw one, throw another player's piece from any building into the volcano, then draw again.</li>
<li><b>Relatives:</b> if the part of the building where you place already holds pieces (any colour), you may place 1 extra piece for each of them: in a different building of the same colour, the other part of the same building, or a neutral (unnumbered) house. Never in the same part, only 1 per building, no chain reactions. If spaces run out, extra relatives are lost.</li>
<li>If every card in your hand is wild, you may call "The volcano erupts!" and end phase 1.</li></ul>
<h3>THE ERUPTION</h3>
<ul><li>When the second AD 79 card is drawn, hands and unplaced pieces go back in the box.</li>
<li>Starting with the left-hand neighbour of whoever drew it, players each draw and place 1 lava tile until 6 are on the board. The first tile of each symbol goes on that symbol's first lava square; later tiles go next to a tile of the same symbol. Pieces under lava go into the volcano.</li></ul>
<h3>PHASE 2 · RUN FOR YOUR LIVES</h3>
<ul><li>The left-hand neighbour of whoever placed the 6th tile starts. On your turn: draw and place 1 lava tile, then move up to 2 of your pieces.</li>
<li>A piece moves up to 1 square for each piece (any colour) on its square. Orthogonal only, turns allowed, no going back over a square. Passing through a gate costs 1 and saves the piece.</li>
<li>No moving onto lava or onto an empty first lava square. Any number of pieces may share a square.</li>
<li>Pieces cut off from every gate go straight into the volcano.</li>
<li><b>Exceptions:</b> with only 1 piece left in the city you may move it twice. A piece that started your turn alone on its square may also move twice.</li></ul>
<h3>END</h3>
<p>The game ends after the player who draws the last lava tile finishes their turn (or earlier if nobody is left in the city). Pieces still inside are lost. Most pieces saved wins; a tie goes to whoever has fewer pieces in the volcano.</p>`;

    onlineCfg[i].role = r; openSetup();
  });
  document.getElementById('setupRules').onclick = () => { m.innerHTML = `<div class="mbox">${RULES}<button class="btn primary" id="back">Back</button></div>`; document.getElementById('back').onclick = openSetup; };
  const sb = document.getElementById('startBtn');
  if (sb) sb.onclick = () => {
    const cfg = setupCfg.filter(c => c.on);
    if (!cfg.some(c => !c.ai)) { setErr('At least one household needs a player.'); return; }
    m.hidden = true; m.innerHTML = ''; resetNet(); startGame(cfg, {dual:setupDual});
  };
  const hb = document.getElementById('hostBtn');
  if (hb) hb.onclick = () => {
    const on = onlineCfg.filter(c => c.role !== 'off');
    if (on.filter(c => c.role === 'me').length !== 1) { setErr('Choose one family for yourself (Me).'); return; }
    if (!on.some(c => c.role === 'friend')) { setErr('Choose at least one family for a friend.'); return; }
    hostRoom(on);
  };
  const jb = document.getElementById('joinBtn');
  if (jb) {
    const inp = document.getElementById('codeIn'); inp.focus();
    inp.oninput = () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); };
    inp.onkeydown = e => { if (e.key === 'Enter') jb.click(); };
    jb.onclick = () => { const code = inp.value.trim(); if (code.length !== 5) { setErr('Room codes have 5 letters and numbers.'); return; } joinRoom(code); };
  }
}

/* =============== Online play (PeerJS, browser to browser) =============== */
const PEER_PREFIX = 'flight-vesuvius-';
function makeCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
function resetNet() {
  if (NET.mode === 'host' && NET.conns) for (const [, c] of NET.conns) { try { c.send({t:'closed'}); } catch (e) {} }
  if (NET.peer) { const p = NET.peer; setTimeout(() => { try { p.destroy(); } catch (e) {} }, 300); }
  NET = {mode:'local'};
}
function sendTo(seat, msg) { const c = NET.conns.get(seat); if (c && c.open) c.send(msg); }
let bcastTimer = null;
function scheduleBroadcast() { if (bcastTimer == null) bcastTimer = setTimeout(flushBroadcast, 0); }
function flushBroadcast() {
  clearTimeout(bcastTimer); bcastTimer = null;
  if (NET.mode !== 'host' || !S) return;
  for (const [seat, conn] of NET.conns) if (conn.open) conn.send({t:'state', s:snapshot(seat)});
}
function snapshot(seat) {
  const key = t => t.dual ? 'z' + t.dual.join() : t.sym;
  return {players:S.players.map((p, i) => ({...p, hand: i === seat ? p.hand : []})), cits:S.cits, deckN:S.deck.length, discard:S.discard,
    bag:[...S.bag].sort((a, b) => key(a) < key(b) ? -1 : 1), lava:[...S.lava], phase:S.phase, stirred:S.stirred, cur:S.cur, tile:S.tile, fresh:S.fresh,
    log:S.log, over:S.over, dual:S.dual, lavaPlaced:S.lavaPlaced, pool:S.pool};
}
function noPeerLib() { if (window.Peer) return false; setErr('Online play could not load its connection library. Check your internet connection and reload the page.'); return true; }

function hostRoom(seats) {
  if (noPeerLib()) return;
  resetNet();
  const code = makeCode();
  NET = {mode:'host', code, seats, conns:new Map(), pending:new Map(), pendingSpec:new Map(), acks:new Map(), started:false, mySeat:seats.findIndex(c => c.role === 'me')};
  const peer = new Peer(PEER_PREFIX + code); NET.peer = peer;
  renderLobby('Opening the room…');
  peer.on('open', () => renderLobby());
  peer.on('error', e => { if (NET.peer !== peer) return; if (e.type === 'unavailable-id') { hostRoom(seats); return; } renderLobby(`Connection problem (${e.type}). Close this and try again.`); });
  peer.on('disconnected', () => { if (NET.peer === peer && !peer.destroyed) try { peer.reconnect(); } catch (e) {} });
  peer.on('connection', conn => {
    conn.on('open', () => {
      if (NET.peer !== peer) return;
      const free = NET.seats.findIndex((c, i) => c.role === 'friend' && !NET.conns.has(i));
      if (free < 0 || NET.started) { conn.send({t:'full'}); setTimeout(() => conn.close(), 500); return; }
      conn.seat = free; NET.conns.set(free, conn);
      conn.send({t:'welcome', seat:free, gens:HOUSES[NET.seats[free].house].gens});
      renderLobby();
    });
    conn.on('data', d => onHostData(conn.seat, d));
    conn.on('close', () => onGuestLeft(conn));
  });
}
function renderLobby(note) {
  if (NET.mode !== 'host' || NET.started) return;
  const m = document.getElementById('modal'); const ready = NET.seats.every((c, i) => c.role !== 'friend' || NET.conns.has(i));
  const open = NET.peer && NET.peer.open;
  m.innerHTML = `<div class="mbox"><h2>Your room</h2>
    ${open ? `<p>Send this code to your friend. They open this same page, choose <b>Join online</b> and enter it.</p><div class="roomcode" aria-label="Room code">${NET.code}</div><div class="row-btns"><button class="btn" id="copyCode">Copy code</button></div>` : `<p>${note || 'Opening the room…'}</p>`}
    ${open && note ? `<p class="err">${note}</p>` : ''}
    ${NET.seats.map((c, i) => { const h = HOUSES[c.house]; const st = c.role === 'me' ? 'You' : c.role === 'ai' ? 'Computer' : NET.conns.has(i) ? '<b style="color:#7fe0b0">Connected</b>' : 'Waiting for a friend…';
      return `<div class="setup-row"><span class="dot" style="background:${h.color}"></span><b style="font-family:var(--display)">${h.gens}</b><span>${st}</span></div>`; }).join('')}
    <div class="row-btns" style="margin-top:14px"><button class="btn primary" id="beginOnline" ${ready && open ? '' : 'disabled'}>Begin the day</button><button class="btn" id="cancelRoom">Cancel</button></div></div>`;
  m.hidden = false;
  const cc = document.getElementById('copyCode'); if (cc) cc.onclick = () => { navigator.clipboard.writeText(NET.code).then(() => cc.textContent = 'Copied', () => cc.textContent = 'Copy failed: type it instead'); };
  document.getElementById('cancelRoom').onclick = () => { resetNet(); openSetup(); };
  document.getElementById('beginOnline').onclick = () => {
    NET.started = true; m.hidden = true; m.innerHTML = '';
    startGame(NET.seats.map(c => ({house:c.house, ai:c.role === 'ai', remote:c.role === 'friend'})), {dual:setupDual});
  };
}
function onHostData(seat, d) {
  if (seat == null || !d) return;
  if (d.t === 'answer') { const r = NET.pending.get(seat); if (r) { NET.pending.delete(seat); NET.pendingSpec.delete(seat); r(d.v); } }
  else if (d.t === 'ack') { const a = NET.acks.get(seat); if (a) { NET.acks.delete(seat); a(); } }
}
function onGuestLeft(conn) {
  if (NET.mode !== 'host' || conn.seat == null || NET.conns.get(conn.seat) !== conn) return;
  const seat = conn.seat; NET.conns.delete(seat);
  if (!NET.started) { renderLobby(); return; }
  const p = S.players[seat]; p.remote = false; p.ai = true;
  log(`The ${hn(seat)} lost their connection. The computer takes over their household.`, true);
  const spec = NET.pendingSpec.get(seat), r = NET.pending.get(seat);
  if (r) {
    NET.pending.delete(seat); NET.pendingSpec.delete(seat);
    if (spec.kind === 'cell') r(spec.buttons && spec.buttons.some(b => b.value === 'skip') ? 'skip' : spec.cells[0]);
    else if (spec.kind === 'place') { const i = spec.cardOpts.findIndex(o => o.cells.length); r(i < 0 ? {idx:0, k:null} : {idx:i, k:spec.cardOpts[i].cells[0]}); }
    else if (spec.kind === 'choice') r(spec.buttons[0].value);
    else r(null);
  }
  const a = NET.acks.get(seat); if (a) { NET.acks.delete(seat); a(); }
  render();
}

function joinRoom(code) {
  if (noPeerLib()) return;
  resetNet();
  NET = {mode:'guest', mySeat:null, code};
  const peer = new Peer(); NET.peer = peer;
  setErr('Connecting…');
  const fail = t => { if (NET.peer !== peer) return; resetNet(); setupMode = 'join'; openSetup(); setErr(t); };
  peer.on('error', e => fail(e.type === 'peer-unavailable' ? `No open room with code ${code}. Check the code and that the host's page is still open.` : `Could not connect (${e.type}). Try again.`));
  peer.on('open', () => {
    const conn = peer.connect(PEER_PREFIX + code, {reliable:true}); NET.host = conn;
    conn.on('data', onGuestData);
    conn.on('close', () => { if (NET.host !== conn) return; const was = NET.mySeat != null; resetNet(); if (was) showInfo(`<h2>Disconnected</h2><p>The connection to the host was lost. Ask them to create a new room, then join again.</p>`); });
    setTimeout(() => { if (NET.host === conn && NET.mySeat == null) fail(`The room ${code} did not answer. Check the code and try again.`); }, 12000);
  });
}
function onGuestData(d) {
  const m = document.getElementById('modal');
  if (d.t === 'welcome') {
    NET.mySeat = d.seat;
    m.innerHTML = `<div class="mbox"><h2>You are the ${d.gens}</h2><p>You're in the room. The game starts when the host begins the day. Keep this page open.</p><button class="btn" id="leave">Leave room</button></div>`; m.hidden = false;
    document.getElementById('leave').onclick = () => { resetNet(); openSetup(); };
  } else if (d.t === 'full') {
    resetNet(); setupMode = 'join'; openSetup(); setErr('That room is full or the game has already started.');
  } else if (d.t === 'state') {
    if (!NET.inGame) { NET.inGame = true; m.hidden = true; m.innerHTML = ''; }
    const pk = S && S.pick, s = d.s;
    S = {...s, deck:Array(s.deckN).fill(0), lava:new Map(s.lava), pick:pk || null};
    S.prompt = pk ? pk.prompt : s.over ? '' : S.cur === NET.mySeat ? 'Your turn…' : `The ${hn(S.cur)} are taking their turn.`;
    render();
  } else if (d.t === 'pick') {
    const sp = d.spec;
    S.pick = {...sp, sel:null, selCid:null, resolve: v => { S.pick = null; NET.host.send({t:'answer', v}); S.prompt = 'Sent. Waiting…'; render(); }};
    S.prompt = sp.prompt; render();
  } else if (d.t === 'card') {
    const mine = d.pi === NET.mySeat;
    showLocalCard(d.html, mine ? 'Continue' : 'Close', mine ? () => NET.host.send({t:'ack'}) : null);
  } else if (d.t === 'over') {
    gameOver();
  } else if (d.t === 'closed') {
    NET.host = null; resetNet(); showInfo(`<h2>The host closed the room</h2><p>Ask them for a new code to play again.</p>`);
  }
}

function startGame(cfg, opts) { RUN++; S = newState(cfg, opts); render(); gameLoop().catch(e => console.error(e)); }
function gameOver() {
  if (NET.mode === 'host') { flushBroadcast(); for (const [, conn] of NET.conns) conn.send({t:'over'}); }
  const order = S.players.map((p, i) => ({p, i})).sort((a, b) => b.p.escaped - a.p.escaped || a.p.lost - b.p.lost);
  const w = order[0], winners = order.filter(o => o.p.escaped === w.p.escaped && o.p.lost === w.p.lost);
  setPrompt(winners.length > 1 ? 'The game ends in a tie.' : `The <b>${w.p.gens}</b> saved the most of their people.`);
  showInfo(`<h2>${winners.length > 1 ? 'A shared survival' : `The ${w.p.gens} win`}</h2>
    <p>${winners.length > 1 ? 'Tied on pieces saved and pieces in the volcano.' : `The ${hn(w.i)} saved the most pieces${order[1] && order[1].p.escaped === w.p.escaped ? ', and won the tie with fewer in the volcano' : ''}.`}</p>
    ${order.map((o, r) => `<div class="result"><span class="rk">${r + 1}</span><span><span class="dot" style="background:${o.p.color}"></span> <b>${o.p.gens}</b> <span style="color:var(--ash);font-size:.85rem">${o.p.ai ? 'computer' : 'player'}</span></span><span>${o.p.escaped} saved · ${o.p.lost} in volcano</span></div>`).join('')}
    <div class="row-btns" style="margin-top:14px"><button class="btn primary" id="again">Play again</button><a class="btn" href="../" style="text-decoration:none">← Game table</a></div>`);
  const a = document.getElementById('again'); if (a) a.onclick = () => { document.getElementById('modal').hidden = true; resetNet(); openSetup(); };
}
document.getElementById('rulesBtn').onclick = () => { const m = document.getElementById('modal'); if (!m.hidden) return; showInfo(RULES); };
document.getElementById('newBtn').onclick = () => { const m = document.getElementById('modal'); m.hidden = true; m.innerHTML = ''; RUN++; resetNet(); openSetup(); };

S = newState(setupCfg.filter(c => c.on));
S.prompt = 'Choose your players to begin.';
render();
openSetup();
</script>
