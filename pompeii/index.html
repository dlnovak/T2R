<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight from Vesuvius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:wght@400;500;700&family=Alegreya:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  /* Fresco night: Pompeian red and ochre on volcanic black; the board is a painted plan of the walled city */
  --night:#130d0c; --panel:#211614; --fresco:#9b2d20; --ochre:#d9a43a; --plaster:#f1e5c9; --ash:#a1968e; --ink:#25180f;
  --line:rgba(217,164,58,.32);
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'Alegreya Sans', 'Gill Sans', system-ui, sans-serif;
  --flavor:'Alegreya', Georgia, serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);background-image:radial-gradient(120% 60% at 15% -10%, rgba(155,45,32,.45), transparent 60%),radial-gradient(80% 50% at 100% 0%, rgba(217,164,58,.10), transparent 60%);color:var(--plaster);font-family:var(--body);font-size:16px;line-height:1.4}
button{font:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
h1{font-family:var(--display);font-weight:900;font-size:1.35rem;letter-spacing:.06em;margin:0;color:var(--ochre);text-wrap:balance}
h1 small{display:block;font-weight:500;font-size:.62rem;letter-spacing:.22em;color:var(--ash)}
.chip{font-family:var(--display);font-size:.72rem;letter-spacing:.12em;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--plaster);background:rgba(155,45,32,.35)}
.spacer{flex:1}
.btn{background:transparent;color:var(--plaster);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.85rem}
.btn:hover{border-color:var(--ochre)}
.btn.primary{background:var(--fresco);border-color:#c5503d;color:#fff;font-weight:700}
.btn.primary:hover{background:#b23726}
.layout{display:grid;gap:14px}
.mountain{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.mountain svg{width:92px;height:56px;flex:0 0 auto}
.mt-title{font-family:var(--display);font-size:.75rem;letter-spacing:.14em;color:var(--ochre)}
.mt-counts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:3px;font-variant-numeric:tabular-nums}
.mt-counts span{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid #000}
.boardwrap{margin-top:10px;background:#1b1210;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:inset 0 0 0 4px #2a1c18}
#board{display:block;width:100%;height:auto;max-width:640px;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#board .hit{fill:transparent;cursor:pointer}
#board .hl{fill:rgba(255,215,106,.28);stroke:#ffd76a;stroke-width:2.2;pointer-events:none;animation:hl 1.1s ease-in-out infinite alternate}
@keyframes hl{from{fill-opacity:.25;stroke-opacity:.6}to{fill-opacity:.7;stroke-opacity:1}}
#board .glow{animation:glow 1.6s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{from{opacity:0}to{opacity:.32}}
#board .fresh{animation:fresh 1.2s ease-out 1}
@keyframes fresh{from{opacity:.9}to{opacity:0}}
.promptbar{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;background:linear-gradient(90deg,rgba(155,45,32,.35),rgba(33,22,20,.9));border:1px solid var(--line);border-radius:12px;min-height:58px}
#prompt{flex:1;font-size:.95rem}
#prompt b{color:var(--ochre)}
#actions{display:flex;gap:8px}
.tile{display:inline-block;width:42px;height:42px;flex:0 0 auto;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px #000,0 0 14px rgba(255,120,40,.55)}
.tile svg{width:100%;height:100%;display:block}
.section-h{font-family:var(--display);font-size:.78rem;letter-spacing:.16em;color:var(--ochre);margin:16px 0 6px}
.hand{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 14px;scroll-snap-type:x proximity}
.hand .card{scroll-snap-align:start}
.hand-note{color:var(--ash);font-size:.88rem;padding:6px 0}
/* ---------- Cards ---------- */
.card{font-size:10px;width:13em;flex:0 0 auto;background:linear-gradient(170deg,#f6edd6,#e6d5b1);color:var(--ink);border-radius:.8em;border:1px solid #6b4e33;box-shadow:0 .35em .9em rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;position:relative;text-align:left;padding:0;transition:transform .15s ease, box-shadow .15s ease}
.card.big{font-size:18px;cursor:default}
.hand .card{cursor:pointer}
.card.sel{transform:translateY(-.6em);box-shadow:0 0 0 .25em var(--ochre),0 .8em 1.4em rgba(0,0,0,.6)}
.card.dim{opacity:.55}
.cband{background:var(--bc);display:flex;justify-content:space-between;align-items:center;padding:.35em .6em .3em;border-bottom:1px solid rgba(0,0,0,.35);gap:.4em}
.cnum{font-family:var(--display);font-weight:900;font-size:1.9em;line-height:1;color:var(--ink)}
.ckind{font-family:var(--display);font-size:.75em;letter-spacing:.14em;font-weight:700;color:rgba(37,24,15,.8)}
.cpips{display:flex;gap:.2em}
.cpips i{width:.75em;height:.75em;border-radius:50%;background:var(--ink);display:block;box-shadow:inset 0 0 0 .14em #f6edd6}
.cart{margin:.45em .5em .2em;border-radius:.4em;background:radial-gradient(120% 90% at 50% 10%, #fbf4e2, #e9d8b5);border:1px solid rgba(107,78,51,.35)}
.cart svg{display:block;width:100%;height:auto}
.cname{font-family:var(--display);font-weight:700;font-size:1.15em;line-height:1.1;padding:.15em .6em 0;text-wrap:balance}
.clatin{font-family:var(--flavor);font-style:italic;font-size:.95em;color:#7a5634;padding:0 .6em}
.cfact{font-size:.93em;line-height:1.3;padding:.35em .6em .2em;margin:0;flex:1}
.cfoot{display:flex;justify-content:space-between;align-items:flex-end;padding:.25em .6em .55em;font-family:var(--display);font-size:.8em;font-weight:700;letter-spacing:.06em;color:#5b3f27}
.cfoot svg{width:4.4em;height:4.4em;border:1px solid rgba(0,0,0,.35);border-radius:.2em}
.ceffect{margin:.2em .6em .6em;padding:.45em .55em;border:1px solid rgba(37,24,15,.45);border-radius:.35em;background:rgba(255,255,255,.35);font-size:.92em;line-height:1.3;font-weight:500}
.ceffect b{font-family:var(--display);font-size:.85em;letter-spacing:.08em;display:block;color:var(--fresco)}
.pcard{background:linear-gradient(170deg,#ece1cf,#d5c3a6)}
.pcard .cband{background:#2c1b2b;color:var(--ochre)}
.pcard .cnum,.pcard .ckind{color:var(--ochre)}
.pcard .cart{background:radial-gradient(120% 90% at 50% 10%, #4a3446, #241522)}
.ecard{background:linear-gradient(170deg,#f3dcc0,#dcae86)}
.ecard .cband{background:linear-gradient(90deg,#7a140a,#d2501a)}
.ecard .cnum,.ecard .ckind{color:#ffe2a8}
.ecard .cart{background:radial-gradient(120% 90% at 50% 10%, #3b1a12, #120806)}
.cdate{font-family:var(--flavor);font-style:italic;font-size:.9em;color:#7a3d1c;padding:0 .6em}
/* ---------- Side panel ---------- */
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.houses{display:flex;flex-direction:column;gap:6px}
.house{display:grid;grid-template-columns:14px 1fr auto;gap:4px 10px;align-items:center;padding:7px 8px;border-radius:8px;border:1px solid transparent}
.house.cur{border-color:var(--pc);background:rgba(255,255,255,.04)}
.house .sw{width:14px;height:14px;border-radius:50%;background:var(--pc);border:2px solid #000}
.house .nm{font-family:var(--display);font-weight:700;font-size:.9rem}
.house .nm small{font-family:var(--body);font-weight:500;color:var(--ash);font-size:.75rem;margin-left:6px}
.house .st{grid-column:2/4;display:flex;gap:12px;font-size:.78rem;color:var(--ash);font-variant-numeric:tabular-nums}
.house .st b{color:var(--plaster)}
.house .esc{font-family:var(--display);font-weight:900;font-size:1.2rem;color:var(--pc);font-variant-numeric:tabular-nums}
#log{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;font-size:.85rem}
#log li{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}
#log li.ev{color:var(--ochre);font-family:var(--display);font-size:.78rem;letter-spacing:.06em}
.hn{color:var(--pc);font-weight:700}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.legend div{display:flex;align-items:center;gap:6px;font-size:.78rem}
.legend .tile{width:30px;height:30px;box-shadow:0 0 0 1px #000}
.legend b{font-family:var(--display);font-size:.78rem;display:block}
.legend span span{color:var(--ash);font-size:.72rem}
/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(8,4,3,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:calc(100% - 8px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox.cardbox{background:transparent;border:0;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:12px;width:auto}
.mbox h2{font-family:var(--display);color:var(--ochre);margin:0 0 8px;font-size:1.3rem;text-wrap:balance}
.mbox h3{font-family:var(--display);color:var(--ochre);font-size:.9rem;letter-spacing:.1em;margin:16px 0 4px}
.mbox p,.mbox li{font-size:.95rem}
.mbox ul{padding-left:18px;margin:4px 0}
.drawnby{font-size:.9rem;color:var(--ash)}
.setup-row{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ash);padding:6px 12px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--fresco);color:#fff;font-weight:700}
.setup-row.off{opacity:.35}
.result{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.result .rk{font-family:var(--display);font-weight:900;color:var(--ochre)}
/* ---------- Narrow screens: stacked, page scrolls ---------- */
.toprow,.bottomrow,.panelcol{display:flex;flex-direction:column;gap:12px}
.panelcol{margin-top:12px}
.housepanel .houses{display:grid;grid-template-columns:1fr;gap:4px}
/* ---------- Wide screens (16:9 and similar): everything on one screen ---------- */
@media (min-width:900px) and (min-aspect-ratio:5/4){
  html,body{height:100%;overflow:hidden}
  body{font-size:clamp(12px,1.45vh,16px)}
  #app{height:100%;max-width:none;display:flex;flex-direction:column;padding:8px 16px 12px}
  header{padding:0 0 6px;margin-bottom:8px;flex-wrap:nowrap}
  h1{font-size:1.25rem}
  h1 small{display:inline;margin-left:10px}
  .layout{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:stretch}
  .boardcol{height:100%;aspect-ratio:1/1;min-height:0}
  .boardwrap{height:100%;margin:0;padding:4px;display:flex;align-items:center;justify-content:center}
  #board{height:100%;width:auto;max-width:100%}
  .panelcol{margin:0;min-height:0;gap:8px}
  .toprow{flex-direction:row;align-items:stretch;gap:8px}
  .mountain{flex-direction:column;justify-content:center;text-align:center;padding:6px 10px;gap:4px;flex:0 0 auto}
  .mountain svg{width:8.5vh;height:5.2vh}
  .mt-counts{justify-content:center}
  .housepanel{flex:1;padding:6px 8px}
  .housepanel .houses{grid-template-columns:1fr 1fr}
  .house{padding:4px 6px;gap:1px 8px}
  .house .st{gap:8px;font-size:.78em}
  .house .nm small{font-size:.7em}
  .house .nm small .tr{display:none}
  .promptbar{margin:0;min-height:0;padding:7px 10px}
  .handwrap{flex:0 0 auto}
  .handwrap .section-h{margin:0 0 2px}
  .hand{overflow:visible;padding:6px 2px 8px;gap:1.2vh}
  .hand .card{font-size:clamp(7px,1.32vh,14px)}
  .hand-note{max-width:60ch}
  .bottomrow{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:8px}
  .bottomrow .panel{min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:6px 10px}
  .legend{gap:4px 8px}
  .legend .tile{width:3vh;height:3vh}
  #log{flex:1;max-height:none;min-height:0;font-size:.82em}
  .section-h{font-size:.72em}
}
.tabs{display:flex;margin:4px 0 12px;width:100%}
.tabs button{flex:1}
.err{color:#ff8a7a;font-size:.88rem;min-height:1.2em}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.lbl{display:block;font-family:var(--display);font-size:.8rem;letter-spacing:.1em;color:var(--ochre);margin-bottom:4px}
.codein{font-family:var(--display);font-size:1.6rem;letter-spacing:.3em;text-transform:uppercase;width:100%;max-width:240px;padding:8px 12px;background:#140d0c;color:var(--plaster);border:1px solid var(--line);border-radius:8px}
.codein:focus{outline:2px solid var(--ochre)}
.roomcode{font-family:var(--display);font-weight:900;font-size:2.6rem;letter-spacing:.3em;color:var(--ochre);text-align:center;padding:10px;margin:8px 0;border:1px dashed var(--line);border-radius:10px;background:#140d0c}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Flight from Vesuvius<small>POMPEII · AD 79</small></h1>
    <span class="chip" id="phase">Settling the city</span>
    <span class="chip" id="pile">Draw pile</span>
    <span class="spacer"></span>
    <a class="btn" href="../" style="text-decoration:none">← Game table</a>
    <button class="btn" id="rulesBtn">How to play</button>
    <button class="btn" id="newBtn">New game</button>
  </header>
  <div class="layout">
    <div class="boardcol"><div class="boardwrap"><svg id="board" viewBox="-70 -70 660 660" role="img" aria-label="Map of Pompeii and the countryside around its walls"></svg></div></div>
    <div class="panelcol">
      <div class="toprow">
        <div class="mountain" id="mountain"></div>
        <div class="panel housepanel"><div class="houses" id="houses"></div></div>
      </div>
      <div class="promptbar"><span id="tileSlot"></span><div id="prompt">Choose your households to begin.</div><div id="actions"></div></div>
      <div class="handwrap">
        <div class="section-h" id="handTitle">Your hand</div>
        <div class="hand" id="hand"></div>
      </div>
      <div class="bottomrow">
        <div class="panel"><div class="section-h" style="margin-top:0">The six vents</div><div class="legend" id="legend"></div></div>
        <div class="panel logpanel"><div class="section-h" style="margin-top:0">Chronicle</div><ol id="log"></ol></div>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="modal" hidden></div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
'use strict';
/* =============== Static data =============== */
const N = 13, CS = 40;
const K = (c, r) => c + ',' + r;
const P = k => k.split(',').map(Number);
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const interior = (c, r) => c >= 1 && c <= 11 && r >= 1 && r <= 11;
const INK = '#2b1d14', COL = '#f3e8cc';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const HOUSES = [
  {gens:'Umbricii', m:'Umbricius', f:'Umbricia', color:'#d63a2c', light:'#ff8a7a', trade:'garum makers'},
  {gens:'Caecilii', m:'Caecilius', f:'Caecilia', color:'#2f67c8', light:'#8fb4ff', trade:'bankers'},
  {gens:'Popidii',  m:'Popidius',  f:'Popidia',  color:'#e2ae1c', light:'#ffd862', trade:'old nobility'},
  {gens:'Holconii', m:'Holconius', f:'Holconia', color:'#22a17a', light:'#6fe0bb', trade:'wine growers'},
];
const PRAE = ['Gaius','Lucius','Marcus','Publius','Quintus','Titus','Aulus','Decimus','Gnaeus','Sextus','Numerius','Spurius'];
const COGF = ['Prima','Secunda','Tertia','Maxima','Paulla','Rufa','Iusta','Fortunata','Felicula'];

const GATES = [
  {id:1, name:'Porta Marina',   short:'MARINA',   c:0,  r:7},
  {id:2, name:'Porta Ercolano', short:'ERCOLANO', c:2,  r:0},
  {id:3, name:'Porta Vesuvio',  short:'VESUVIO',  c:6,  r:0},
  {id:4, name:'Porta di Nola',  short:'NOLA',     c:12, r:3},
  {id:5, name:'Porta di Sarno', short:'SARNO',    c:12, r:7},
  {id:6, name:'Porta di Nocera',short:'NOCERA',   c:10, r:12},
  {id:7, name:'Porta di Stabia',short:'STABIA',   c:6,  r:12},
];
const GATE_BY_KEY = new Map();
GATES.forEach(g => {
  g.k = K(g.c, g.r);
  g.inner = g.r === 0 ? K(g.c,1) : g.r === 12 ? K(g.c,11) : g.c === 0 ? K(1,g.r) : K(11,g.r);
  g.rot = g.r === 0 ? 0 : g.r === 12 ? 180 : g.c === 0 ? -90 : 90;
  GATE_BY_KEY.set(g.k, g);
});

const ROAD = new Set();
for (let i = 1; i <= 11; i++) { ROAD.add(K(i,7)); ROAD.add(K(6,i)); ROAD.add(K(i,3)); ROAD.add(K(2,i)); ROAD.add(K(10,i)); }

const BUILD = [
  {roman:'I',   name:'Forum', latin:'Forum Pompeianum', icon:'forum', color:'#c8b088', cells:[[3,8],[4,8],[3,9],[4,9]],
   fact:'The civic heart of the city. Its Temple of Jupiter was still being repaired from the earthquake of AD 62 when the mountain woke.'},
  {roman:'II',  name:'Temple of Apollo', latin:'Templum Apollinis', icon:'temple', color:'#cf9061', cells:[[1,8],[1,9]],
   fact:'One of the oldest sanctuaries in Pompeii. A bronze Apollo, drawing his bow, stood before its colonnade.'},
  {roman:'III', name:'Basilica', latin:'Basilica', icon:'basilica', color:'#b09d80', cells:[[3,11],[4,11],[5,11]],
   fact:'Law court and trading hall from the 2nd century BC. Its walls carry some of the oldest graffiti in the city.'},
  {roman:'IV',  name:'Stabian Baths', latin:'Thermae Stabianae', icon:'baths', color:'#8db3b1', cells:[[7,8],[8,8],[7,9]],
   fact:'The oldest public baths in town, with separate suites for men and women warmed by hollow hypocaust floors.'},
  {roman:'V',   name:'House of the Faun', latin:'Domus Fauni', icon:'faun', color:'#cfa64c', cells:[[3,4],[4,4],[3,5]],
   fact:'A mansion filling a whole city block, named for its dancing bronze faun. The Alexander Mosaic covered one floor.'},
  {roman:'VI',  name:'Large Theatre', latin:'Theatrum Maius', icon:'theatre', color:'#b9826c', cells:[[7,11],[8,11],[9,11]],
   fact:'About 5,000 spectators sat in tiers built into a natural slope. Awnings shaded them from the summer sun.'},
  {roman:'VII', name:'Amphitheatre', latin:'Amphitheatrum', icon:'amphi', color:'#ad8a62', cells:[[11,8],[11,9],[11,10],[11,11]],
   fact:'The oldest surviving stone amphitheatre, built about 70 BC. A riot in AD 59 got its games banned for ten years.'},
  {roman:'VIII',name:'Macellum', latin:'Macellum', icon:'macellum', color:'#a3b37c', cells:[[1,4],[1,5]],
   fact:'The covered food market. Fish scales were found in the drain beneath its round central pavilion.'},
  {roman:'IX',  name:'Bakery of Modestus', latin:'Pistrinum Modesti', icon:'bakery', color:'#cc9461', cells:[[8,4]],
   fact:'81 carbonised loaves were found still in its oven, each scored into eight wedges for breaking.'},
  {roman:'X',   name:'Fullery of Stephanus', latin:'Fullonica Stephani', icon:'fullery', color:'#97a8bd', cells:[[9,8],[9,9]],
   fact:'Workers cleaned cloth by treading it in vats of water mixed with urine, then bleached it with sulphur smoke.'},
  {roman:'XI',  name:'House of the Vettii', latin:'Domus Vettiorum', icon:'vettii', color:'#bf7d72', cells:[[3,1],[4,1]],
   fact:'Home of two freed slaves who grew rich in trade. Its dining rooms are painted with cupids at work.'},
  {roman:'XII', name:'Temple of Isis', latin:'Iseum', icon:'isis', color:'#a996b9', cells:[[7,10],[8,10]],
   fact:'Rebuilt after AD 62 by a freedman in the name of his six-year-old son, which won the boy a seat on the town council.'},
];
const CELLB = new Map();
BUILD.forEach((b, i) => { b.i = i; b.cells = b.cells.map(([c,r]) => K(c,r)); b.cells.forEach(k => CELLB.set(k, b)); });

const VENTS = [
  {id:0, name:'Ignis',   gloss:'fire',        origin:K(5,5),  color:'#ff6a2b'},

function glyph(vid, s = 1, color = '#000') {
  const g = {
    0: `<path d="M0 8 C-6 8 -8 2 -5 -2 C-4 1 -2 1 -2 -1 C-2 -5 1 -7 0 -10 C6 -6 8 0 6 4 C5 7 2 8 0 8Z" fill="${color}"/>`,
    1: [[-5,-4],[4,-5],[0,1],[-4,6],[5,5],[-7,1]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="1.9" fill="${color}"/>`).join(''),
    2: `<circle cx="-4" cy="3" r="4" fill="${color}"/><circle cx="4.5" cy="2" r="3.2" fill="${color}"/><circle cx="0" cy="-5" r="2.7" fill="${color}"/>`,
    3: `<path d="M0 0 a2 2 0 1 1 2 2 a4 4 0 1 1 -4 -4 a6.5 6.5 0 1 1 6.5 6.5" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`,
    4: [-5,0,5].map(y => `<path d="M-8 ${y} q2 -3 4 0 t4 0 t4 0 t4 0" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`).join(''),
    5: `<path d="M-8 6 L-4 -5 L3 -8 L8 0 L4 7Z" fill="${color}"/>`,
  }[vid];
  return `<g transform="scale(${s})">${g}</g>`;
}
function tileSVG(v) {
  return `<svg viewBox="-12 -12 24 24"><defs><radialGradient id="tg${v.id}"><stop offset="0" stop-color="#ffd25a"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#9e1f0a"/></radialGradient></defs>
    <rect x="-12" y="-12" width="24" height="24" fill="url(#tg${v.id})"/>${glyph(v.id, .85, 'rgba(70,10,2,.75)')}</svg>`;
}
function miniMap(b) {
  let s = `<svg viewBox="0 0 13 13" aria-hidden="true"><rect width="13" height="13" fill="#4b423b"/>`;
  for (let r = 1; r <= 11; r++) for (let c = 1; c <= 11; c++) {
    const k = K(c,r); const f = b.cells.includes(k) ? '#9b2d20' : ROAD.has(k) ? '#6f6a64' : '#e3d3b0';
    s += `<rect x="${c}" y="${r}" width="1" height="1" fill="${f}"/>`;
  }
  GATES.forEach(g => s += `<rect x="${g.c}" y="${g.r}" width="1" height="1" fill="#1b120e"/>`);
  return s + '</svg>';
}

/* =============== Cards =============== */
function pips(n) { return `<span class="cpips" aria-label="Holds ${n}">${'<i></i>'.repeat(n)}</span>`; }
function buildingCard(b, attrs = '', cls = '') {
  return `<div class="card ${cls}" style="--bc:${b.color}" ${attrs}>
    <div class="cband"><span class="cnum">${b.roman}</span><span class="ckind">AEDIFICIUM</span>${pips(b.cells.length)}</div>
    <div class="cart">${ICON[b.icon](b.color)}</div>
    <div class="cname">${b.name}</div>${b.latin !== b.name ? `<div class="clatin">${b.latin}</div>` : '<div class="clatin">&nbsp;</div>'}
    <p class="cfact">${b.fact}</p>
    <div class="cfoot"><span>Shelters ${b.cells.length}</span>${miniMap(b)}</div></div>`;
}
function portentCard(p, cls = '') {
  return `<div class="card pcard ${cls}"><div class="cband"><span class="cnum">☉</span><span class="ckind">PORTENTUM</span></div>
    <div class="cart">${ICON[p.key]()}</div><div class="cname">${p.title}</div>
    <p class="cfact" style="font-family:var(--flavor);font-style:italic">${p.flavor}</p>
    <div class="ceffect"><b>OMEN</b>Cast one rival citizen into the Mountain. Then draw again.</div></div>`;
}
function eventCard(e, cls = '') {
  return `<div class="card ecard ${cls}"><div class="cband"><span class="cnum">AD LXXIX</span><span class="ckind">${e.type === 'tremor' ? 'I' : 'II'}</span></div>
    <div class="cart">${ICON[e.type]()}</div><div class="cname">${e.title}</div><div class="cdate">${e.date}</div>
    <p class="cfact" style="font-family:var(--flavor);font-style:italic">${e.flavor}</p>
    <div class="ceffect"><b>${e.type === 'tremor' ? 'TREMOR' : 'ERUPTION'}</b>${e.effect}</div></div>`;
}
function cardHTML(card, cls) {
  if (card.type === 'building') return buildingCard(BUILD[card.b], '', cls);
  if (card.type === 'portent') return portentCard(PORTENTS[card.p], cls);
  return eventCard(card.type === 'tremor' ? TREMOR : ERUPTION, cls);
}

/* =============== State =============== */
let S = null, RUN = 0;
let NET = {mode:'local'};
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const POOL = 9;

function newState(cfg) {
  const n = cfg.length;
  const players = cfg.map((c, i) => ({...HOUSES[c.house], hi:c.house, ai:c.ai, remote:!!c.remote, hand:[], escaped:0, lost:0}));
  const cits = []; let id = 0;
  players.forEach((p, pi) => {
    const prae = shuffle(PRAE.slice()), cog = shuffle(COGF.slice());
    for (let i = 0; i < POOL; i++) cits.push({id:id++, p:pi, state:'home', k:null, name: i % 2 ? `${p.f} ${cog[i]}` : `${prae[i]} ${p.m}`});
  });
  const bcards = shuffle([].concat(...BUILD.map(b => [0,1,2].map(() => ({type:'building', b:b.i})))));
  players.forEach(p => { p.hand = bcards.splice(0, 4); });
  const nPort = Math.min(6, n + 1);
  const portents = shuffle(PORTENTS.map((_, i) => ({type:'portent', p:i}))).slice(0, nPort);
  const mid = shuffle(bcards.splice(0, 7 * n - nPort).concat(portents));
  const deck = mid.slice(0, 4 * n).concat([{type:'tremor'}], mid.slice(4 * n), [{type:'eruption'}]);
  const lavaDeck = shuffle([].concat(...VENTS.map(v => Array(7).fill(v.id))));
  return {players, cits, deck, lavaDeck, lava:new Map(), phase:'place', stirred:false, cur:Math.floor(Math.random()*n), pick:null, tile:null, fresh:null, log:[], over:false};
}

const citsAt = k => S.cits.filter(c => c.state === 'board' && c.k === k);
const boardCits = () => S.cits.filter(c => c.state === 'board');
const homeCount = pi => S.cits.filter(c => c.p === pi && c.state === 'home').length;
const hn = pi => `<span class="hn" style="--pc:${S.players[pi].light}">${S.players[pi].gens}</span>`;
const cn = c => `<span class="hn" style="--pc:${S.players[c.p].light}">${c.name}</span>`;
const placeName = k => CELLB.has(k) ? `the ${CELLB.get(k).name}` : ROAD.has(k) ? 'a paved road' : 'a side street';
const manh = (a, b) => { const [x1,y1] = P(a), [x2,y2] = P(b); return Math.abs(x1-x2) + Math.abs(y1-y2); };
function log(html, ev) { S.log.unshift({html, ev}); if (S.log.length > 120) S.log.pop(); }

/* =============== Geometry =============== */
function distMap(extra) {
  const L = k => S.lava.has(k) || k === extra; const d = new Map(), q = [];
  for (const g of GATES) { if (L(g.inner) || d.has(g.inner)) continue; d.set(g.inner, 1); q.push(g.inner); }
  while (q.length) { const u = q.shift(); const [c,r] = P(u);
    for (const [dc,dr] of DIRS) { const nc = c+dc, nr = r+dr, nk = K(nc,nr); if (!interior(nc,nr) || L(nk) || d.has(nk)) continue; d.set(nk, d.get(u)+1); q.push(nk); } }
  return d;
}
function reachable(k) {
  const steps = ROAD.has(k) ? 3 : 2; const seen = new Map([[k,0]]), q = [k], out = new Map();
  while (q.length) { const u = q.shift(), du = seen.get(u); if (du >= steps) continue; const [c,r] = P(u);
    for (const [dc,dr] of DIRS) { const nc = c+dc, nr = r+dr, nk = K(nc,nr);
      if (GATE_BY_KEY.has(nk)) { if (!out.has(nk)) out.set(nk, du+1); continue; }
      if (!interior(nc,nr) || S.lava.has(nk) || seen.has(nk)) continue;

/* =============== Game loop =============== */
async function gameLoop() {
  const n = S.players.length; let lastHuman = -1;
  const humans = S.players.filter(p => !p.ai).length;
  log(`The households of Pompeii go about an ordinary day. The ${S.players[S.cur].gens} move first.`, true); render();
  while (!S.over) {
    const pi = S.cur, p = S.players[pi];
    if (NET.mode === 'local' && !p.ai && humans > 1 && lastHuman !== pi) {
      S.handoff = true; render();
      await showModal(`<div class="mbox"><h2>Pass to the ${p.gens}</h2><p>Hand the device to the player of the ${hn(pi)}. Other players look away.</p>`, `I am the ${p.gens}`);
      S.handoff = false; lastHuman = pi;
    }
    if (p.ai) setPrompt(`The ${hn(pi)} are deciding…`);
    if (S.phase === 'place') await placeTurn(pi);
    else await flightTurn(pi);
    render();
    if (S.phase === 'flight' && (!boardCits().length || !S.lavaDeck.length)) {
      if (boardCits().length) { log('The last of the lava pours over the city.', true); boardCits().forEach(c => kill(c, 'surge')); }
      S.over = true;
    }
    S.cur = (S.cur + 1) % n;
  }
  S.phase = 'over'; render(); gameOver();
}

async function placeTurn(pi) {
  const p = S.players[pi]; const home = homeCount(pi); let choice;
  if (p.ai) { await sleep(750); choice = aiPlacement(pi); }
  else {
    setPrompt(home ? `Your turn. Tap a card, then a <b>glowing square</b> in that building to place a citizen.` : `Your whole household is in the city. Tap a card to discard it.`);
    choice = await pick({kind:'place', pi, sel:null, cells:new Set(), discard:!home});
  }
  const card = p.hand.splice(choice.idx, 1)[0], b = BUILD[card.b];
  if (choice.k == null) log(`${hn(pi)} discard the ${b.name}.`);
  else {
    const own = b.cells.includes(choice.k);
    const occ = own ? b.cells.filter(x => citsAt(x).length).length : 0;
    placeCit(pi, choice.k, own ? '' : `(the ${b.name} was full)`);
    const bonus = Math.min(occ, 2, homeCount(pi));
    if (bonus > 0) log(`Kinship: relatives in the ${b.name} take in ${bonus} more of the ${hn(pi)}.`);
    render();
    for (let i = 0; i < bonus; i++) {
      const cells = bonusCells(); if (!cells.length) break; let k;
      if (p.ai) { await sleep(450); k = aiBestCell(cells, pi); }
      else { setPrompt(`<b>Kinship!</b> Your citizen found relatives in the ${b.name}. Place ${bonus - i} more on any glowing building square.`); k = await pick({kind:'cell', pi, cells:new Set(cells)}); }
      placeCit(pi, k, '(kinship)'); render();
    }
  }
  while (S.deck.length) {
    const c = S.deck.shift();
    if (c.type === 'building') { p.hand.push(c); break; }
    if (c.type === 'portent') {
      await showCard(c, pi);
      const targets = boardCits().filter(x => x.p !== pi);
      if (!targets.length) { log(`${PORTENTS[c.p].title}: no rival is in the city to suffer it.`, true); continue; }
      let k;
      if (p.ai) { await sleep(500); k = aiPortent(pi, targets).k; }
      else { setPrompt(`<b>${PORTENTS[c.p].title}.</b> Tap a rival citizen to cast into the Mountain.`); k = await pick({kind:'cell', pi, cells:new Set(targets.map(x => x.k))}); }
      kill(citsAt(k).find(x => x.p !== pi), 'portent', pi); render(); continue;
    }
    if (c.type === 'tremor') {
      await showCard(c, pi); S.stirred = true; log('AD 79. The mountain splits open.', true); render();
      for (let j = 0; j < S.players.length; j++) await lavaStep((pi + j) % S.players.length);
      continue;
    }
    if (c.type === 'eruption') {
      await showCard(c, pi); S.phase = 'flight'; S.players.forEach(x => x.hand = []);
      log('Night falls under the ash. The flight from Pompeii begins.', true); return;
    }
  }
}

async function lavaStep(pi) {
  const p = S.players[pi]; if (!S.lavaDeck.length) return;
  const v = VENTS[S.lavaDeck.shift()]; S.tile = {v, pi}; render();
  const cells = legalLava(v);
  if (!cells.length) { log(`The ${v.name} flow is walled in. Its tile is set aside.`); await sleep(600); S.tile = null; return; }
  let k;
  if (p.ai) { setPrompt(`The ${hn(pi)} drew a <b>${v.name}</b> tile.`); await sleep(800); k = aiLava(pi, v, cells); }
  else { setPrompt(`You drew <b>${v.name}</b> (${v.gloss}). Place it on a glowing square${S.lava.size && [...S.lava.values()].includes(v.id) ? `, touching the ${v.name} flow` : ` over its crater`}.`); k = await pick({kind:'cell', pi, cells:new Set(cells)}); }
  placeLava(k, v, pi); S.tile = null; render(); await sleep(300);
}

async function flightTurn(pi) {
  const p = S.players[pi];
  if (!S.lavaDeck.length) return;
  await lavaStep(pi);
  if (S.players.length === 2 && S.lavaDeck.length && boardCits().length) await lavaStep(pi);
  if (!boardCits().length) return;
  const mine = () => boardCits().filter(c => c.p === pi);
  if (!mine().length) { log(`${hn(pi)} have no one left in the city, but the mountain answers to them still.`); await sleep(300); return; }
  const moved = new Set();
  for (let m = 0; m < 2; m++) {
    if (!mine().some(c => !moved.has(c.id))) break; let mv;
    if (p.ai) { await sleep(650); mv = aiMove(pi, moved); if (!mv) break; }
    else {
      setPrompt(`${m === 0 ? 'Move up to two citizens.' : 'Move one more citizen, or end your turn.'} Tap one of yours, then a glowing square. Paved roads let a citizen run 3 squares, side streets 2.`);
      mv = await pick({kind:'move', pi, moved, sel:null, cells:new Set()}); if (!mv) break;
    }
    moveCit(mv.cit, mv.dest); moved.add(mv.cit.id); render();
  }
}

/* =============== AI =============== */

    const L = legalPlacement(b), occ = b.cells.filter(x => citsAt(x).length).length;

  return best;
}

  for (const k of cells) {
    let sc = Math.random() * .8; const d2 = distMap(k);
    for (const c of bc) { const w = c.p !== pi ? 1 : -1.4;
      if (c.k === k) { sc += w * 10; continue; }
      if (!d2.has(c.k)) { sc += w * 8; continue; }
      sc += w * (d2.get(c.k) - (base.get(c.k) ?? d2.get(c.k))) * 1.5;

}

  if (pk) {
    if (pk.kind === 'cell' && pk.cells.has(k)) return pk.resolve(k);
    if (pk.kind === 'place' && pk.sel != null && pk.cells.has(k)) return pk.resolve({idx:pk.sel, k});
    if (pk.kind === 'move') {
      if (pk.sel && pk.cells.has(k)) return pk.resolve({cit:pk.sel, dest:k});
      const mine = citsAt(k).filter(c => c.p === pk.pi && !pk.moved.has(c.id));
      if (mine.length) { if (pk.sel && pk.sel.k === k) { pk.sel = null; pk.cells = new Set(); } else { pk.sel = mine[0]; pk.cells = new Set(reachable(k).keys()); } render(); return; }
      if (pk.sel) { pk.sel = null; pk.cells = new Set(); render(); return; }
    }
  }
  const b = CELLB.get(k);
  if (b && (!pk || (pk.kind === 'place' && pk.sel == null))) showInfo(buildingCard(b, '', 'big'));
  else if (GATE_BY_KEY.has(k) && !pk) { const g = GATE_BY_KEY.get(k); showInfo(`<div class="mbox"><h2>${g.name}</h2><p>One of the seven gates in Pompeii's walls. Step onto it to escape the city. It closes for good if lava covers the square just inside it.</p></div>`); }
});
function handPick(i) {
  const pk = S.pick;
  if (pk && pk.kind === 'place') {
    if (pk.discard) return pk.resolve({idx:i, k:null});
    pk.sel = pk.sel === i ? null : i; pk.cells = pk.sel == null ? new Set() : new Set(legalPlacement(BUILD[S.players[pk.pi].hand[i].b]).cells); render();
  } else { const v = viewer(); if (v >= 0) showInfo(buildingCard(BUILD[S.players[v].hand[i].b], '', 'big')); }
}
document.getElementById('hand').addEventListener('click', e => { const c = e.target.closest('.card[data-idx]'); if (c) handPick(+c.dataset.idx); });
document.getElementById('hand').addEventListener('keydown', e => { const c = e.target.closest('.card[data-idx]'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); handPick(+c.dataset.idx); } });
function showInfo(inner) {
  const m = document.getElementById('modal'); if (!m.hidden) return;
  m.innerHTML = `<div class="mbox ${inner.startsWith('<div class="card') ? 'cardbox' : ''}">${inner}<button class="btn" id="mClose">Close</button></div>`; m.hidden = false;
  const close = () => { m.hidden = true; m.innerHTML = ''; }; document.getElementById('mClose').onclick = close; document.getElementById('mClose').focus();
}

/* =============== Rules / setup / end =============== */
const RULES = `<h2>How to play</h2>
<p>It is AD 79 and Vesuvius is about to erupt. Each player leads a Pompeian household. Get the most family members out through the city's seven gates before the lava buries everything.</p>
<h3>I · SETTLING THE CITY</h3>
<ul><li>On your turn, play one building card and place a citizen from home on a free square of that building. If the building is full, place on any free building square.</li>
<li><b>Kinship:</b> if the building already shelters people, they take in more of your family: place 1 extra citizen per occupied square there (2 at most), on any free building square.</li>
<li>Then draw a card. A <b>Portent</b> lets you cast one rival citizen into the Mountain; then draw again.</li></ul>
<h3>II · THE MOUNTAIN STIRS</h3>
<ul><li>When the first <b>AD LXXIX</b> card is drawn, every household places one lava tile, starting with the one who drew it. Settling then continues.</li></ul>
<h3>III · FLIGHT</h3>
<ul><li>The second AD LXXIX card starts the flight. Hands are discarded.</li>
<li>Each turn, first draw a lava tile (two in a 2-player game) and place it touching lava of the same vent. A vent's first tile covers its crater. Citizens under it are lost.</li>
<li>Any citizen with no open path to a gate is entombed.</li>
<li>Then move up to two different citizens: <b>3 squares</b> if they start on a dark basalt road, <b>2</b> otherwise, never through lava. Step onto a gate to escape. A square can hold any number of citizens.</li>
<li>Households with no one left in the city still place lava every turn.</li></ul>
<h3>THE END</h3>
<p>The game ends when nobody is left in the city or the lava tiles run out (anyone still inside is lost). The household with the most escaped wins. Ties go to whoever lost fewer.</p>
<p style="color:var(--ash);font-size:.85rem">Tip: tap any building on the map to read its card, and tap a gate to see its name.</p>`;

let setupMode = 'local';
let setupCfg = [{house:0, ai:false, on:true}, {house:1, ai:true, on:true}, {house:2, ai:true, on:true}, {house:3, ai:true, on:false}];
let onlineCfg = [{house:0, role:'me'}, {house:1, role:'friend'}, {house:2, role:'off'}, {house:3, role:'off'}];
const ROLE_LABEL = {me:'Me', friend:'Friend', ai:'Computer', off:'Out'};

function setupTabs() {
  return `<div class="seg tabs" role="tablist">${[['local','This device'],['host','Host online'],['join','Join online']].map(([m, l]) => `<button data-mode="${m}" aria-pressed="${setupMode === m}">${l}</button>`).join('')}</div>`;
}
function setupHTML() {
  let body = '';
  if (setupMode === 'local') {
    body = `<p>Everyone plays on this screen. Choose who plays each family.</p>
    ${setupCfg.map((c, i) => { const h = HOUSES[c.house]; return `<div class="setup-row ${c.on ? '' : 'off'}"><span class="dot" style="background:${h.color}"></span><span><b style="font-family:var(--display)">${h.gens}</b><span style="display:block;color:var(--ash);font-size:.8rem">${h.trade}</span></span>
      <span class="seg" role="group" aria-label="${h.gens}">${i > 1 ? `<button data-i="${i}" data-v="off" aria-pressed="${!c.on}">Out</button>` : ''}<button data-i="${i}" data-v="human" aria-pressed="${c.on && !c.ai}">Player</button><button data-i="${i}" data-v="ai" aria-pressed="${c.on && c.ai}">Computer</button></span></div>`; }).join('')}
    <p id="setupErr" class="err"></p>
    <div class="row-btns"><button class="btn primary" id="startBtn">Begin the day</button><button class="btn" id="setupRules">How to play</button></div>`;
  } else if (setupMode === 'host') {
    body = `<p>Each friend plays on their own computer and sees only their own cards. Pick your family and theirs, then create a room and send them the code.</p>
    ${onlineCfg.map((c, i) => { const h = HOUSES[c.house]; return `<div class="setup-row ${c.role === 'off' ? 'off' : ''}"><span class="dot" style="background:${h.color}"></span><span><b style="font-family:var(--display)">${h.gens}</b></span>
      <span class="seg" role="group" aria-label="${h.gens}">${['me','friend','ai','off'].filter(r => r !== 'off' || i > 1).map(r => `<button data-oi="${i}" data-r="${r}" aria-pressed="${c.role === r}">${ROLE_LABEL[r]}</button>`).join('')}</span></div>`; }).join('')}
    <p id="setupErr" class="err"></p>
    <div class="row-btns"><button class="btn primary" id="hostBtn">Create room</button><button class="btn" id="setupRules">How to play</button></div>`;
  } else {
    body = `<p>Ask the host for their room code, then enter it here. Keep this page open for the whole game.</p>
    <label for="codeIn" class="lbl">Room code</label>
    <input id="codeIn" class="codein" maxlength="5" autocomplete="off" spellcheck="false" placeholder="ABC12">
    <p id="setupErr" class="err"></p>
    <div class="row-btns"><button class="btn primary" id="joinBtn">Join room</button><button class="btn" id="setupRules">How to play</button></div>`;
  }
  return `<div class="mbox"><h2>Flight from Vesuvius</h2>${setupTabs()}${body}</div>`;
}
function setErr(t) { const e = document.getElementById('setupErr'); if (e) e.textContent = t; }
function openSetup() {
  const m = document.getElementById('modal'); m.innerHTML = setupHTML(); m.hidden = false;
  m.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { setupMode = b.dataset.mode; openSetup(); });
  m.querySelectorAll('.seg button[data-i]').forEach(b => b.onclick = () => { const c = setupCfg[+b.dataset.i]; if (b.dataset.v === 'off') c.on = false; else { c.on = true; c.ai = b.dataset.v === 'ai'; } openSetup(); });
  m.querySelectorAll('.seg button[data-oi]').forEach(b => b.onclick = () => {
    const i = +b.dataset.oi, r = b.dataset.r;
    if (r === 'me') onlineCfg.forEach((c, j) => { if (c.role === 'me' && j !== i) c.role = 'friend'; });
    onlineCfg[i].role = r; openSetup();
  });
  document.getElementById('setupRules').onclick = () => { m.innerHTML = `<div class="mbox">${RULES}<button class="btn primary" id="back">Back</button></div>`; document.getElementById('back').onclick = openSetup; };
  const sb = document.getElementById('startBtn');
  if (sb) sb.onclick = () => {
    const cfg = setupCfg.filter(c => c.on);
    if (!cfg.some(c => !c.ai)) { setErr('At least one household needs a player.'); return; }
    m.hidden = true; m.innerHTML = ''; resetNet(); startGame(cfg);
  };
  const hb = document.getElementById('hostBtn');
  if (hb) hb.onclick = () => {
    const on = onlineCfg.filter(c => c.role !== 'off');
    if (on.filter(c => c.role === 'me').length !== 1) { setErr('Choose one family for yourself (Me).'); return; }
    if (!on.some(c => c.role === 'friend')) { setErr('Choose at least one family for a friend.'); return; }
    hostRoom(on);
  };
  const jb = document.getElementById('joinBtn');
  if (jb) {
    const inp = document.getElementById('codeIn'); inp.focus();
    inp.oninput = () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); };
    inp.onkeydown = e => { if (e.key === 'Enter') jb.click(); };
    jb.onclick = () => { const code = inp.value.trim(); if (code.length !== 5) { setErr('Room codes have 5 letters and numbers.'); return; } joinRoom(code); };
  }
}

/* =============== Online play (PeerJS, browser to browser) =============== */
const PEER_PREFIX = 'flight-vesuvius-';
function makeCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
function resetNet() {
  if (NET.mode === 'host' && NET.conns) for (const [, c] of NET.conns) { try { c.send({t:'closed'}); } catch (e) {} }
  if (NET.peer) { const p = NET.peer; setTimeout(() => { try { p.destroy(); } catch (e) {} }, 300); }
  NET = {mode:'local'};
}
function sendTo(seat, msg) { const c = NET.conns.get(seat); if (c && c.open) c.send(msg); }
let bcastTimer = null;
function scheduleBroadcast() { if (bcastTimer == null) bcastTimer = setTimeout(flushBroadcast, 0); }
function flushBroadcast() {
  clearTimeout(bcastTimer); bcastTimer = null;
  if (NET.mode !== 'host' || !S) return;
  for (const [seat, conn] of NET.conns) if (conn.open) conn.send({t:'state', s:snapshot(seat)});
}
function snapshot(seat) {
  return {players:S.players.map((p, i) => ({...p, hand: i === seat ? p.hand : []})), cits:S.cits, deckN:S.deck.length,
    lavaDeck:[...S.lavaDeck].sort(), lava:[...S.lava], phase:S.phase, stirred:S.stirred, cur:S.cur, tile:S.tile, fresh:S.fresh, log:S.log, over:S.over};
}
function noPeerLib() { if (window.Peer) return false; setErr('Online play could not load its connection library. Check your internet connection and reload the page.'); return true; }

function hostRoom(seats) {
  if (noPeerLib()) return;
  resetNet();
  const code = makeCode();
  NET = {mode:'host', code, seats, conns:new Map(), pending:new Map(), pendingSpec:new Map(), acks:new Map(), started:false, mySeat:seats.findIndex(c => c.role === 'me')};
  const peer = new Peer(PEER_PREFIX + code); NET.peer = peer;
  renderLobby('Opening the room…');
  peer.on('open', () => renderLobby());
  peer.on('error', e => { if (NET.peer !== peer) return; if (e.type === 'unavailable-id') { hostRoom(seats); return; } renderLobby(`Connection problem (${e.type}). Close this and try again.`); });
  peer.on('disconnected', () => { if (NET.peer === peer && !peer.destroyed) try { peer.reconnect(); } catch (e) {} });
  peer.on('connection', conn => {
    conn.on('open', () => {
      if (NET.peer !== peer) return;
      const free = NET.seats.findIndex((c, i) => c.role === 'friend' && !NET.conns.has(i));
      if (free < 0 || NET.started) { conn.send({t:'full'}); setTimeout(() => conn.close(), 500); return; }
      conn.seat = free; NET.conns.set(free, conn);
      conn.send({t:'welcome', seat:free, gens:HOUSES[NET.seats[free].house].gens});
      renderLobby();
    });
    conn.on('data', d => onHostData(conn.seat, d));
    conn.on('close', () => onGuestLeft(conn));
  });
}
function renderLobby(note) {
  if (NET.mode !== 'host' || NET.started) return;
  const m = document.getElementById('modal'); const ready = NET.seats.every((c, i) => c.role !== 'friend' || NET.conns.has(i));
  const open = NET.peer && NET.peer.open;
  m.innerHTML = `<div class="mbox"><h2>Your room</h2>
    ${open ? `<p>Send this code to your friend. They open this same page, choose <b>Join online</b> and enter it.</p><div class="roomcode" aria-label="Room code">${NET.code}</div><div class="row-btns"><button class="btn" id="copyCode">Copy code</button></div>` : `<p>${note || 'Opening the room…'}</p>`}
    ${open && note ? `<p class="err">${note}</p>` : ''}
    ${NET.seats.map((c, i) => { const h = HOUSES[c.house]; const st = c.role === 'me' ? 'You' : c.role === 'ai' ? 'Computer' : NET.conns.has(i) ? '<b style="color:#7fe0b0">Connected</b>' : 'Waiting for a friend…';
      return `<div class="setup-row"><span class="dot" style="background:${h.color}"></span><b style="font-family:var(--display)">${h.gens}</b><span>${st}</span></div>`; }).join('')}
    <div class="row-btns" style="margin-top:14px"><button class="btn primary" id="beginOnline" ${ready && open ? '' : 'disabled'}>Begin the day</button><button class="btn" id="cancelRoom">Cancel</button></div></div>`;
  m.hidden = false;
  const cc = document.getElementById('copyCode'); if (cc) cc.onclick = () => { navigator.clipboard.writeText(NET.code).then(() => cc.textContent = 'Copied', () => cc.textContent = 'Copy failed: type it instead'); };
  document.getElementById('cancelRoom').onclick = () => { resetNet(); openSetup(); };
  document.getElementById('beginOnline').onclick = () => {
    NET.started = true; m.hidden = true; m.innerHTML = '';
    startGame(NET.seats.map(c => ({house:c.house, ai:c.role === 'ai', remote:c.role === 'friend'})));
  };
}
function onHostData(seat, d) {
  if (seat == null || !d) return;
  if (d.t === 'answer') { const r = NET.pending.get(seat); if (r) { NET.pending.delete(seat); NET.pendingSpec.delete(seat); r(d.v); } }
  else if (d.t === 'ack') { const a = NET.acks.get(seat); if (a) { NET.acks.delete(seat); a(); } }
}
function onGuestLeft(conn) {
  if (NET.mode !== 'host' || conn.seat == null || NET.conns.get(conn.seat) !== conn) return;
  const seat = conn.seat; NET.conns.delete(seat);
  if (!NET.started) { renderLobby(); return; }
  const p = S.players[seat]; p.remote = false; p.ai = true;
  log(`The ${hn(seat)} lost their connection. The computer takes over their household.`, true);
  const spec = NET.pendingSpec.get(seat), r = NET.pending.get(seat);
  if (r) {
    NET.pending.delete(seat); NET.pendingSpec.delete(seat);
    if (spec.kind === 'cell') r([...spec.cells][0]);
    else if (spec.kind === 'place') r(spec.discard ? {idx:0, k:null} : (() => { const c = aiPlacement(seat); return {idx:c.idx, k:c.k}; })());
    else r(null);
  }
  const a = NET.acks.get(seat); if (a) { NET.acks.delete(seat); a(); }
  render();
}

function joinRoom(code) {
  if (noPeerLib()) return;
  resetNet();
  NET = {mode:'guest', mySeat:null, code};
  const peer = new Peer(); NET.peer = peer;
  setErr('Connecting…');
  const fail = t => { if (NET.peer !== peer) return; resetNet(); setupMode = 'join'; openSetup(); setErr(t); };
  peer.on('error', e => fail(e.type === 'peer-unavailable' ? `No open room with code ${code}. Check the code and that the host's page is still open.` : `Could not connect (${e.type}). Try again.`));
  peer.on('open', () => {
    const conn = peer.connect(PEER_PREFIX + code, {reliable:true, serialization:'json'}); NET.host = conn;
    conn.on('data', onGuestData);
    conn.on('close', () => { if (NET.host !== conn) return; const was = NET.mySeat != null; resetNet(); if (was) showInfo(`<h2>Disconnected</h2><p>The connection to the host was lost. Ask them to create a new room, then join again.</p>`); });
    setTimeout(() => { if (NET.host === conn && NET.mySeat == null) fail(`The room ${code} did not answer. Check the code and try again.`); }, 12000);
  });
}
function onGuestData(d) {
  const m = document.getElementById('modal');
  if (d.t === 'welcome') {
    NET.mySeat = d.seat;
    m.innerHTML = `<div class="mbox"><h2>You are the ${d.gens}</h2><p>You're in the room. The game starts when the host begins the day. Keep this page open.</p><button class="btn" id="leave">Leave room</button></div>`; m.hidden = false;
    document.getElementById('leave').onclick = () => { resetNet(); openSetup(); };
  } else if (d.t === 'full') {
    resetNet(); setupMode = 'join'; openSetup(); setErr('That room is full or the game has already started.');
  } else if (d.t === 'state') {
    if (!NET.inGame) { NET.inGame = true; m.hidden = true; m.innerHTML = ''; }
    const pk = S && S.pick, s = d.s;
    S = {...s, deck:Array(s.deckN).fill(0), lava:new Map(s.lava), pick:pk || null};
    S.prompt = pk ? pk.prompt : s.over ? '' : S.cur === NET.mySeat ? 'Your turn…' : `The ${hn(S.cur)} are taking their turn.`;
    render();
  } else if (d.t === 'pick') {
    const sp = d.spec;
    S.pick = {...sp, cells:new Set(sp.cells), moved:new Set(sp.moved), sel:null,
      resolve: v => { S.pick = null; NET.host.send({t:'answer', v: sp.kind === 'move' && v ? {cid:v.cit.id, dest:v.dest} : v}); S.prompt = 'Sent. Waiting…'; render(); }};
    S.prompt = sp.prompt; render();
  } else if (d.t === 'card') {
    const mine = d.pi === NET.mySeat;
    showLocalCard(d.html, mine ? 'Continue' : 'Close', mine ? () => NET.host.send({t:'ack'}) : null);
  } else if (d.t === 'over') {
    gameOver();
  } else if (d.t === 'closed') {
    NET.host = null; resetNet(); showInfo(`<h2>The host closed the room</h2><p>Ask them for a new code to play again.</p>`);
  }
}
function startGame(cfg) { RUN++; S = newState(cfg); render(); gameLoop().catch(e => console.error(e)); }
function gameOver() {
  if (NET.mode === 'host') { flushBroadcast(); for (const [, conn] of NET.conns) conn.send({t:'over'}); }
  const order = S.players.map((p, i) => ({p, i})).sort((a, b) => b.p.escaped - a.p.escaped || a.p.lost - b.p.lost);
  const w = order[0];
  const tie = order[1] && order[1].p.escaped === w.p.escaped && order[1].p.lost === w.p.lost;
  setPrompt(tie ? 'The day ends in a tie.' : `The <b>${w.p.gens}</b> save the most of their household.`);
  showInfo(`<h2>${tie ? 'A shared survival' : `The ${w.p.gens} endure`}</h2>
    <p>${tie ? 'Two households brought out the same number of people.' : `Of the households of Pompeii, the ${hn(w.i)} brought the most of their people through the gates.`}</p>
    ${order.map((o, r) => `<div class="result"><span class="rk">${['I','II','III','IV'][r]}</span><span><span class="dot" style="background:${o.p.color}"></span> <b>${o.p.gens}</b> <span style="color:var(--ash);font-size:.85rem">${o.p.ai ? 'computer' : 'player'}</span></span><span>${o.p.escaped} escaped · ${o.p.lost} lost</span></div>`).join('')}
    <div style="margin-top:14px"><button class="btn primary" id="again">Play again</button></div>`);
  const a = document.getElementById('again'); if (a) a.onclick = () => { document.getElementById('modal').hidden = true; resetNet(); openSetup(); };
}
document.getElementById('rulesBtn').onclick = () => { const m = document.getElementById('modal'); if (!m.hidden) return; showInfo(RULES); };
document.getElementById('newBtn').onclick = () => { const m = document.getElementById('modal'); m.hidden = true; m.innerHTML = ''; RUN++; resetNet(); openSetup(); };

/* Preview board behind the setup screen */
S = newState(setupCfg.filter(c => c.on));
S.prompt = 'Choose your households to begin.';
render();
openSetup();
</script>
</body>
</html>
