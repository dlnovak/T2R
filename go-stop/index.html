<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hwatu Go-Stop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one screen — opponent on top, the olive army blanket as the table, your hand at the bottom */
  --ink:#16150f;
  --blanket:#4a5030;
  --blanket-deep:#2f331d;
  --gold:#e9bb4f;
  --red:#d6312a;
  --paper:#f7f0dd;
  --muted:#c3c5a3;
  --display:'Song Myung','Nanum Myeongjo','AppleMyungjo',serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --hw:min(66px, calc((100vw - 64px) / 5));
  --tw:min(46px, calc((100vw - 48px) / 8));
  --cw:24px;
  --bw:20px;
  color-scheme:dark;
}
@media (min-width:700px){
  :root{ --hw:76px; --tw:58px; --cw:30px; --bw:26px; }
}
@media (min-width:980px){
  :root{ --hw:clamp(64px, 12.5vh, 108px); --tw:clamp(48px, 10.5vh, 88px); --cw:clamp(26px, 5.4vh, 40px); --bw:28px; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--body);color:var(--paper);overflow:hidden;
  background-color:var(--blanket);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
    radial-gradient(130% 85% at 50% 45%, #5b6239 0%, #42472a 60%, var(--blanket-deep) 100%);
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
#app{
  height:100%;max-width:620px;margin:0 auto;
  display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto auto;gap:6px;
  padding:env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
@media (min-width:980px){
  #app{max-width:1140px}
  .side{grid-template-columns:220px 1fr;align-items:end;gap:16px}
  .side .who{flex-wrap:wrap;align-self:center;row-gap:6px}
  .me .who{order:-1}
  #oppHand{margin-left:0;flex-basis:100%}
}
#app{position:relative;z-index:1}
#amb,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#amb{z-index:0}
#fx{z-index:85}
.seal{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:8px;background:var(--red);color:#fff4e0;font-size:19px;border-radius:5px;rotate:-5deg;box-shadow:inset 0 0 0 2px rgba(255,244,224,.35),0 2px 0 rgba(0,0,0,.3);vertical-align:middle;text-shadow:none}
.who .name{transition:color .3s}
.who.active .name{color:var(--gold)}
.who.active .name::before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);vertical-align:middle;animation:blink 1.4s infinite}
.floater{position:fixed;z-index:86;font-family:var(--display);font-size:30px;color:var(--gold);text-shadow:0 2px 0 var(--red),0 6px 18px rgba(0,0,0,.5);pointer-events:none;animation:floatUp 1.3s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.ripple{position:fixed;z-index:2;border-radius:50%;border:2px solid rgba(233,187,79,.75);pointer-events:none;animation:ripple .7s ease-out forwards}
@keyframes ripple{from{opacity:.9;transform:translate(-50%,-50%) scale(.35)}to{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
.lg{display:inline}
.coachslot{position:relative;height:var(--coach-h,84px);max-width:760px;width:100%;justify-self:center;z-index:20}
.coachslot[hidden]{display:none}
.coach{position:absolute;left:0;right:0;bottom:0;min-height:100%;display:flex;gap:10px;align-items:center;background:rgba(247,240,221,.95);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.42;
  box-shadow:0 6px 18px rgba(0,0,0,.3);border-left:4px solid var(--red);animation:coachIn .35s ease;word-break:keep-all;overflow-wrap:anywhere}
@keyframes coachIn{from{opacity:0;translate:0 6px}}
.coach .av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff4e0;display:grid;place-items:center;font-family:var(--display);font-size:16px;box-shadow:inset 0 0 0 2px rgba(255,244,224,.35)}
.coach .ct{display:grid;gap:3px;min-width:0;flex:1;align-content:center;padding:2px 0}
.smv{display:none}
@media (max-width:420px){.smv{display:inline}}
.coach p{margin:0}
.coach .ev{color:#6b6450}
.coach .warn{color:#a8241d}
.coach b{font-weight:400;font-family:var(--display);font-size:15px;color:var(--red)}
.sm{padding:4px 10px;font-size:12px}
#btnCoach{margin-left:auto}
#btnCoach[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
#hand .card.tip{box-shadow:0 0 0 2px var(--gold),0 0 20px rgba(233,187,79,.7)}
body.hints #hand .card.tip.tip::before,#hand .card.tip.tip::before{content:"추천";display:block;white-space:nowrap;width:auto;height:auto;margin-left:0;transform:translateX(-50%);top:-11px;padding:2px 8px;border-radius:999px;background:var(--gold);color:var(--ink);font:11px/1.3 var(--body);box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:2}
.card.rec{box-shadow:0 0 0 3px var(--gold),0 0 26px rgba(233,187,79,.95)}
.coach .cont{flex:none;padding:9px 14px;font-size:14px;white-space:nowrap}
.coach .ev.first{font-size:.94em}
@media (max-width:699px){
  body.coached .status{display:none}
  .coachslot{--coach-h:92px}
  .coach{font-size:12.5px;padding:7px 10px;line-height:1.36}
  .coach .cont{padding:8px 11px;font-size:13px}
  .coach .av{width:22px;height:22px;font-size:13px}
  .coach b{font-size:13.5px}
}
.coachnote{background:#efe5c9;border-left:4px solid var(--red);padding:8px 10px;border-radius:6px;margin-top:10px}
@media (max-width:420px){.lg{display:none}}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:10px 0 2px}
.brand{font-family:var(--display);font-size:26px;line-height:1;color:var(--gold);letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.brand small{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-left:6px;vertical-align:middle}
.brand,.ghost,.tally{white-space:nowrap}
@media (max-width:420px){.brand small{display:none}.ghost{padding:6px 10px}}
.tally{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.25;font-variant-numeric:tabular-nums}
.tally b{color:var(--paper);font-weight:400;font-family:var(--display);font-size:14px}
.ghost{border:1px solid rgba(247,240,221,.28);background:rgba(0,0,0,.18);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.ghost:hover{background:rgba(0,0,0,.3)}
.ghost:focus-visible,.card:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* player strips */
.side{display:grid;gap:4px}
.who{display:flex;align-items:center;gap:10px;min-height:24px}
.who .name{font-size:13px;color:var(--muted);letter-spacing:.04em}
.pts{font-family:var(--display);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.pts small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:2px}
.gochip{font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:2px 8px}
#oppHand{display:flex;margin-left:auto;--w:var(--bw)}
#oppHand .card+.card{margin-left:calc(var(--bw) * -.5)}

.caps{display:grid;grid-template-columns:1fr 1.3fr 1.2fr 1.7fr;gap:8px;--w:var(--cw)}
.cg{min-width:0}
.cgl{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:baseline;white-space:nowrap;height:16px}
.cgl b{font-family:var(--display);font-weight:400;font-size:14px;color:var(--paper);font-variant-numeric:tabular-nums}
.cgl .set{color:var(--gold)}
.cgc{position:relative;height:calc(var(--cw) * 92 / 60);border-radius:4px;background:rgba(0,0,0,.12)}
.cgc .card{position:absolute;top:0;left:0}
.cgc::before{content:attr(data-w);position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--cw) * .75);color:rgba(247,240,221,.13);pointer-events:none;letter-spacing:.1em}

/* table */
#table{
  position:relative;min-height:0;display:flex;align-items:center;gap:12px;padding:14px;
  border:9px solid transparent;border-radius:16px;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 5px) padding-box,
    repeating-linear-gradient(-45deg, rgba(0,0,0,.06) 0 2px, transparent 2px 5px) padding-box,
    radial-gradient(90% 100% at 50% 45%, #5e663d, #3a3f24) padding-box,
    var(--bojagi, #8a3a2a) border-box;
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.35),inset 0 12px 30px rgba(0,0,0,.3);
}
#table::after{content:"";position:absolute;inset:5px;border-radius:9px;border:1px dashed rgba(247,240,221,.2);pointer-events:none}
.season{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden;text-align:center}
.season span{font-family:var(--display);font-size:clamp(54px, 15vh, 150px);line-height:1;color:rgba(247,240,221,.055);letter-spacing:.12em;white-space:nowrap;transition:opacity .6s}
.season small{display:block;font-family:var(--body);font-size:clamp(11px,1.6vh,14px);letter-spacing:.4em;text-transform:uppercase;color:rgba(247,240,221,.16);margin-top:6px}
#deck,#groups{position:relative;z-index:1}
#deck{position:relative;flex:none;width:var(--tw);aspect-ratio:60/92;--w:var(--tw)}
#deck .card{position:absolute;top:0;left:0}
#deck .card:nth-child(2){top:-2px;left:-2px}
#deck .card:nth-child(3){top:-4px;left:-4px}
.dcount{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#groups{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:12px 14px;justify-content:center;align-content:center;--w:var(--tw)}
.grp{display:flex}
.grp .card+.card{margin-left:calc(var(--tw) * -.6)}
.empty-note{font-family:var(--display);color:rgba(247,240,221,.35);font-size:18px}

.status{min-height:22px;text-align:center;font-size:14px;color:var(--paper);display:flex;align-items:center;justify-content:center;gap:8px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.status.wait .dot{background:var(--muted);box-shadow:none;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

#hand{display:grid;grid-template-columns:repeat(5,var(--hw));gap:7px;justify-content:center;--w:var(--hw);padding-top:8px;min-height:calc(var(--hw) * 92 / 60 * 2 + 15px)}
@media (min-width:980px){ #hand{grid-template-columns:repeat(10,var(--hw));gap:8px;padding-top:12px;min-height:calc(var(--hw) * 92 / 60 + 30px)} }

/* cards */
.card{position:relative;width:var(--w);aspect-ratio:60/92;flex:none;transform-origin:0 0;border-radius:calc(var(--w) * .08);
  box-shadow:0 1px 0 rgba(0,0,0,.3),0 3px 7px rgba(0,0,0,.32);transition:translate .18s ease, box-shadow .18s ease, filter .2s ease}
.card svg{display:block;width:100%;height:100%}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);background-size:260% 100%;background-position:130% 0}
.card .cover{position:absolute;inset:0;pointer-events:none}
@media (hover:hover){
  #hand:not(.off) .card:hover{translate:0 -9px;box-shadow:0 0 0 2px rgba(233,187,79,.55),0 12px 20px rgba(0,0,0,.45)}
  #hand:not(.off) .card:hover::after{animation:sheen .9s ease forwards}
}
@keyframes sheen{0%{opacity:1;background-position:130% 0}100%{opacity:1;background-position:-30% 0}}
@media (min-width:980px){ #hand .card{rotate:var(--r,0deg);margin-top:var(--y,0px);transform-origin:50% 100%} }
body.oppturn #oppHand .card{animation:bob 1.1s ease-in-out infinite;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes bob{50%{translate:0 -5px}}
.mn{position:absolute;right:7%;bottom:4%;font:calc(var(--w) * .17)/1 var(--body);color:#fff;background:rgba(22,21,15,.72);border-radius:3px;padding:2px 3px 1px;display:none;font-variant-numeric:tabular-nums}
body.hints .mn{display:block}
.cgc .mn,#oppHand .mn{display:none!important}
#hand .card{cursor:pointer}
#hand.off .card{filter:saturate(.75) brightness(.86);cursor:default}
body.hints #hand .card.hit::before{content:"";position:absolute;left:50%;top:-7px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
#hand .card.sel{translate:0 -10px;box-shadow:0 0 0 2px var(--gold),0 10px 18px rgba(0,0,0,.45)}
.card.match{box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(233,187,79,.65)}
.card.pick{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(233,187,79,.8);cursor:pointer;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{translate:0 -4px}}

/* callout */
.callout{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;z-index:80;opacity:0;isolation:isolate;min-width:260px}
.callout .ink{position:absolute;left:50%;top:42%;width:300px;height:300px;transform:translate(-50%,-50%) rotate(var(--rot,0deg));z-index:-1;fill:var(--red);opacity:.94;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.callout .k{font-family:var(--display);font-size:78px;line-height:1;color:var(--gold);text-shadow:0 3px 0 #5a1a12,0 0 22px rgba(0,0,0,.35)}
.callout .e{margin-top:6px;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper);text-shadow:0 2px 8px rgba(0,0,0,.8)}
.callout.show{animation:pop 1s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

/* modal */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,14,9,.55);backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.panel{width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--paper);color:var(--ink);border-radius:14px;border:5px solid var(--red);
  box-shadow:inset 0 0 0 1px #5a1a12,0 24px 60px rgba(0,0,0,.5);padding:20px 20px 18px}
.panel.wide{width:min(640px,100%)}
.panel h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 4px;text-wrap:balance;color:var(--red)}
.panel h3{font-family:var(--display);font-weight:400;font-size:20px;margin:18px 0 6px;color:var(--ink)}
.panel p{margin:6px 0;line-height:1.5;font-size:14.5px}
.panel ul{margin:6px 0;padding-left:18px;font-size:14.5px;line-height:1.5}
.sub{color:#6b6450;font-size:13px}
.rows{margin:12px 0;border-top:1px solid #d8ccae}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #e3d9bf;font-size:14.5px;font-variant-numeric:tabular-nums}
.row.total{font-family:var(--display);font-size:22px;border-bottom:0;color:var(--red)}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:10px;padding:13px 14px;font-size:16px;cursor:pointer;background:#e7dcc0;color:var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn.big{font-family:var(--display);font-size:24px;padding:12px}
table.score{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.score td{padding:6px 4px;border-bottom:1px solid #e3d9bf;vertical-align:top}
table.score td:last-child{text-align:right;white-space:nowrap;color:var(--red)}
.guide{display:grid;gap:8px;margin-top:8px;--w:40px}
.gm{display:grid;grid-template-columns:112px 1fr;align-items:center;gap:8px}
.gm .nm{font-size:13px;line-height:1.25}
.gm .nm b{font-family:var(--display);font-weight:400;font-size:16px;display:block}
.gm .cs{display:flex;gap:5px}
.gm .card{box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.toggle input{width:18px;height:18px;accent-color:var(--red)}

@media (prefers-reduced-motion:reduce){
  .card,.callout.show,.card.pick{animation:none!important;transition:none!important}
  .callout.show{opacity:1}
}
a.brand{color:inherit;text-decoration:none}
</style>
</head>
<body class="hints">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="cardclip"><rect x="4" y="4" width="52" height="84" rx="3"/></clipPath>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8492f"/><stop offset="1" stop-color="#c0261f"/></linearGradient>
    <pattern id="backpat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#c72b22"/><rect width="4" height="4" fill="#b32019"/></pattern>
  </defs>
</svg>

<div id="app">
  <header class="top">
    <a class="brand" href="../" title="Back to all games"><span class="seal">花</span>화투 <small>Go-Stop</small></a>
    <div class="tally" id="tally"></div>
    <button class="ghost" id="btnSound" type="button" aria-pressed="true" aria-label="Sound">♪</button>
    <button class="ghost" id="btnRules" type="button">Rules</button>
    <button class="ghost" id="btnNew" type="button">New<span class="lg"> deal</span></button>
  </header>

  <section class="side opp" aria-label="Opponent">
    <div class="who"><span class="name">Opponent</span><span class="pts" id="oppPts"></span><span id="oppGo"></span><div id="oppHand"></div></div>
    <div class="caps" id="oppCaps"></div>
  </section>

  <section id="table" aria-label="Table">
    <div class="season" id="season" aria-hidden="true"></div>
    <div id="deck"></div>
    <div id="groups"></div>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="coachslot" id="coach" hidden><div class="coach" aria-live="polite"><span class="av">訓</span><div class="ct" id="coachText"></div><div id="coachBtn"></div></div></div>

  <section class="side me" aria-label="You">
    <div class="caps" id="myCaps"></div>
    <div class="who"><span class="name">You</span><span class="pts" id="myPts"></span><span id="myGo"></span><button class="ghost sm" id="btnCoach" type="button" aria-pressed="false">Coach</button></div>
  </section>

  <div id="hand" aria-label="Your hand"></div>
</div>

<canvas id="amb" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="callout" id="callout"><svg class="ink" viewBox="-150 -150 300 300" aria-hidden="true"></svg><div class="k"></div><div class="e"></div></div>
<div class="modal" id="modal" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script>
(()=>{
/* ---------------- card data ---------------- */
const MONTHS={1:['송학','Pine'],2:['매조','Plum'],3:['벚꽃','Cherry'],4:['흑싸리','Wisteria'],5:['난초','Iris'],6:['모란','Peony'],7:['홍싸리','Bush clover'],8:['공산','Pampas & moon'],9:['국화','Chrysanthemum'],10:['단풍','Maple'],11:['오동','Paulownia'],12:['비','Rain']};
const SPEC={1:['g','r','p','p'],2:['a','r','p','p'],3:['g','r','p','p'],4:['a','r','p','p'],5:['a','r','p','p'],6:['a','r','p','p'],7:['a','r','p','p'],8:['g','a','p','p'],9:['a','r','p','p'],10:['a','r','p','p'],11:['g','p','p','pp'],12:['g','a','r','pp']};
const RIB={1:'hong',2:'hong',3:'hong',4:'cho',5:'cho',7:'cho',6:'cheong',9:'cheong',10:'cheong',12:'plain'};
const CARD={};const ALL=[];

const K='#1c1a19',R='#d6312a',Y='#f2b231',G='#2f7d4b',B='#2a58a8',P='#7d4ea6',PK='#f08fa0',BR='#7b4a22',W='#fffdf6',CR='#f8f1e0';
const f=n=>(+n).toFixed(1);
const circ=(x,y,r,fill,st='',sw=0)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${fill}"${st?` stroke="${st}" stroke-width="${sw}"`:''}/>`;
const ell=(x,y,rx,ry,rot,fill,st='',sw=0)=>`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}" transform="rotate(${rot} ${f(x)} ${f(y)})"${st?` stroke="${st}" stroke-width="${sw}"`:''}/>`;
const pth=(d,fill,st='none',sw=0)=>`<path d="${d}" fill="${fill}" stroke="${st}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
const ln=(x1,y1,x2,y2,st,sw)=>`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${st}" stroke-width="${sw}" stroke-linecap="round"/>`;
function needles(cx,cy,r,a0,a1,n,col){let s='';for(let i=0;i<n;i++){const a=(a0+(a1-a0)*i/(n-1))*Math.PI/180;s+=ln(cx,cy,cx+r*Math.cos(a),cy+r*Math.sin(a),col,1.3);}return s;}
function bloss(cx,cy,r,pc,cc){let s='';for(let i=0;i<5;i++){const a=(i*72-90)*Math.PI/180;s+=circ(cx+r*.6*Math.cos(a),cy+r*.6*Math.sin(a),r*.48,pc,K,.3);}return s+circ(cx,cy,r*.26,cc);}
function strand(x0,y0,x1,y1,n,lc,lc2,bend=6){const qx=(x0+x1)/2+bend,qy=(y0+y1)/2;let s=pth(`M${x0} ${y0}Q${qx} ${qy} ${x1} ${y1}`,'none',K,.9);
  for(let i=1;i<=n;i++){const t=i/(n+1),u=1-t;const x=u*u*x0+2*u*t*qx+t*t*x1,y=u*u*y0+2*u*t*qy+t*t*y1;s+=ell(x-2.3,y,2.7,1.2,-35,i%2?lc:lc2)+ell(x+2.3,y,2.7,1.2,35,i%3?lc2:lc);}return s;}
function mleaf(cx,cy,r,col){const pts=[];for(let i=0;i<14;i++){const a=(i*360/14-90)*Math.PI/180,rr=i%2?r*.45:r;pts.push(f(cx+rr*Math.cos(a))+','+f(cy+rr*Math.sin(a)));}return `<polygon points="${pts.join(' ')}" fill="${col}" stroke="${K}" stroke-width=".3"/>`;}
function chrys(cx,cy,r,col,cc){let s='';for(let i=0;i<16;i++)s+=`<ellipse cx="${cx}" cy="${f(cy-r*.55)}" rx="${f(r*.15)}" ry="${f(r*.48)}" fill="${col}" stroke="${K}" stroke-width=".3" transform="rotate(${i*22.5} ${cx} ${cy})"/>`;return s+circ(cx,cy,r*.26,cc,K,.3);}
function iris(cx,cy){return ell(cx-3,cy,2.4,5,-35,P,K,.3)+ell(cx+3,cy,2.4,5,35,P,K,.3)+ell(cx,cy+3,2.2,4.4,0,'#a77bd0',K,.3)+circ(cx,cy-.5,1,Y);}

  return `<g transform="rotate(-6 30 ${y+22})"><rect x="24" y="${y}" width="12" height="44" fill="${col}" stroke="${K}" stroke-width=".8"/>${st}${t}</g>`;}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const byMonth=(a,b)=>CARD[a].m-CARD[b].m||a.localeCompare(b);
function countMonths(ids){const n={};ids.forEach(id=>n[CARD[id].m]=(n[CARD[id].m]||0)+1);return n;}

async function newRound(){
  closeModal();
  let d,ok;
  do{d=shuffle(ALL.slice());const t=d.slice(20,28),h0=d.slice(0,10),h1=d.slice(10,20);
    ok=![t,h0,h1].some(x=>Object.values(countMonths(x)).some(v=>v>=4));}while(!ok);
  S=blank();S.deck=d;render();S.event=null;
  S.dealing=true;
  S.hands[0]=S.deck.splice(0,10).sort(byMonth);
  S.hands[1]=S.deck.splice(0,10);
  S.table=S.deck.splice(0,8);
  S.msg='Your turn — tap a card, then tap it again to play';
  render();S.dealing=false;
}

function scoreOf(ids){
  const cs=ids.map(i=>CARD[i]),det=[];
  const g=cs.filter(c=>c.t==='g'),a=cs.filter(c=>c.t==='a'),r=cs.filter(c=>c.t==='r'),p=cs.filter(c=>c.t==='p');
  const pv=p.reduce((s,c)=>s+c.pv,0);
  let gp=0;if(g.length===3)gp=g.some(c=>c.m===12)?2:3;else if(g.length===4)gp=4;else if(g.length>=5)gp=15;
  if(gp)det.push([`Brights 광 × ${g.length}${g.length===3&&gp===2?' (incl. rain)':''}`,gp]);
  let ap=a.length>=5?a.length-4:0;if(ap)det.push([`Animals 열끗 × ${a.length}`,ap]);
  const godori=[2,4,8].every(m=>a.some(c=>c.m===m));if(godori){ap+=5;det.push(['Godori 고도리 (three birds)',5]);}

const SND=(()=>{let ctx=null,on=true;try{on=localStorage.getItem('gostop-sound')!=='0';}catch(e){}
  const ac=()=>{if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx;};
  function noise(a,t,len,freq,q,gain){const buf=a.createBuffer(1,Math.floor(a.sampleRate*len),a.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
    const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.value=gain;s.connect(f).connect(g).connect(a.destination);s.start(t);}

    g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0008,t+len);o.connect(g).connect(a.destination);o.start(t);o.stop(t+len+.02);}
  return {
    slap(){if(!on)return;const a=ac();if(!a)return;const t=a.currentTime;noise(a,t,.08,1700+Math.random()*700,.9,.7);tone(a,t,170,55,.1,.35);},
    chime(){if(!on)return;const a=ac();if(!a)return;const t=a.currentTime;tone(a,t,1046,1040,.35,.08);tone(a,t+.07,1568,1560,.4,.06);},
    drum(){if(!on)return;const a=ac();if(!a)return;const t=a.currentTime;tone(a,t,130,48,.45,.6);noise(a,t,.15,400,.6,.4);},
    unlock(){if(on)ac();},
    toggle(){on=!on;try{localStorage.setItem('gostop-sound',on?'1':'0');}catch(e){}if(on)ac();return on;},
    get on(){return on;}
  };})();

/* ---------------- seasonal particles + sparkles ---------------- */

  size();addEventListener('resize',size);

    5:{k:'petal',c:['#8f63c0','#c9b2e6']},6:{k:'petal',c:['#ef5a4c','#f08fa0']},7:{k:'leaf',c:['#d6312a','#2a2826']},8:{k:'glow',c:['#f6d77a','#fff1b8']},

    if(p.k==='rain'){p.vy=10+Math.random()*5;p.vx=-1.6;p.s=12+Math.random()*12;}

function choose(p,ids,src){

  if(a.t===b.t&&a.pv===b.pv&&a.rib===b.rib)return Promise.resolve(ids[0]);
  if(p===1)return Promise.resolve(val(a)>=val(b)?ids[0]:ids[1]);
  const rec=val(a)>=val(b)?ids[0]:ids[1];
  return new Promise(res=>{S.choosing={ids,resolve:res,rec:COACH.on?rec:null};
    setMsg('Two cards match — tap the one you want to take');
    if(COACH.on)S.event={p:0,html:`<p><b>Pick one.</b> Take the ${label(CARD[rec])}: it's worth more than the ${label(CARD[rec===ids[0]?ids[1]:ids[0]])}.</p>`};
    render();});
}
function stealPi(from,to){
  const c=S.cap[from];let i=c.findIndex(id=>CARD[id].t==='p'&&CARD[id].pv===1);if(i<0)i=c.findIndex(id=>CARD[id].t==='p');

  S.table.push(hc);setMsg(p===0?'You play '+MONTHS[m][1]+'…':'Opponent plays '+MONTHS[m][1]+'…',p===1);render();await wait(560);
  const d=S.deck.shift();
  if(d){S.table.push(d);setMsg('Flipped from the pile: '+MONTHS[CARD[d].m][1],p===1);render();await wait(620);}
  const same=d&&CARD[d].m===m;
  let pend=[],cap2=[],steal=0;const calls=[];

  else if(matches.length===1){if(same){calls.push(['뻑','Stuck · three stay on the table']);}else pend=[hc,matches[0]];}
  else if(matches.length===2){if(same){pend=[hc,...matches,d];steal++;calls.push(['따닥','All four · steal 1 junk']);}
    else{const pick=await choose(p,matches,hc);S.choosing=null;pend=[hc,pick];}}

  if(d&&!same){

  }

  if(all.length&&S.table.length===0&&(S.hands[0].length+S.hands[1].length)>0){steal++;calls.push(['쓸','Swept the table · steal 1 junk']);}

  setMsg(all.length?`${who} took ${all.length} card${all.length>1?'s':''}${stolen?` and stole ${stolen} junk`:''}`:`${who} took nothing`,p===1);
  render();await wait(all.length?560:250);

  const sc=scoreOf(S.cap[p]).total;
  if(sc>=7&&sc>S.goAt[p]){
    const canGo=S.hands[p].length>0;
    const go=canGo?(p===0?await askGo(sc):aiGo()):false;
    if(go){S.go[p]++;S.goAt[p]=sc;render();await callout(`${S.go[p]}고`,p===0?'You keep going':'Opponent keeps going');}
    else{if(p===1)await callout('스톱','Opponent stops');endRound(p);return;}
  }
  if(!S.hands[0].length&&!S.hands[1].length){endRound(null);return;}
  S.turn=o;S.busy=false;
  if(o===0)setMsg('Your turn — tap a card, then tap it again to play');else setMsg('Opponent is thinking…',true);
  render();
  if(o===1){
    if(COACH.on){S.waitNext=true;setMsg('Read the coach, then let the opponent play');render();
      const me=S;await new Promise(r=>me.cont=r);if(S!==me)return;
      S.waitNext=false;S.cont=null;setMsg('Opponent is thinking…',true);render();}
    aiTurn();
  }
}
function aiPick(){
  let best=S.hands[1][0],bs=-1e9;
  for(const id of S.hands[1]){const c=CARD[id],ms=S.table.filter(t=>CARD[t].m===c.m);let s;
    if(ms.length===0)s=-val(c)*.6;else if(ms.length===3)s=val(c)+ms.reduce((a,t)=>a+val(CARD[t]),0)+10;else s=val(c)+Math.max(...ms.map(t=>val(CARD[t])));
    s+=Math.random()*3;if(s>bs){bs=s;best=id;}}
  return best;
}
function aiGo(){const ps=scoreOf(S.cap[0]).total;return S.hands[1].length>=3&&ps<=3&&S.go[1]<3&&Math.random()<.7;}
async function aiTurn(){await wait(650);if(S.over||S.turn!==1)return;playTurn(1,aiPick());}
function askGo(sc){
  return new Promise(res=>{
    const adv=COACH.on?goAdvice(sc):null;
    openModal(`<h2>${sc} points</h2><p>You can stop now and collect, or call Go for +1 point and a shot at more. If the opponent reaches 7 after you call Go, they win.</p>
      ${adv?`<p class="coachnote"><b>Coach:</b> ${adv.text}</p>`:''}
      <div class="btns"><button class="btn big${adv&&!adv.go?' primary':''}" id="bStop" type="button">스톱 Stop</button><button class="btn big${!adv||adv.go?' primary':''}" id="bGo" type="button">고 Go</button></div>`);
    $('#bGo').onclick=()=>{closeModal();res(true);};$('#bStop').onclick=()=>{closeModal();res(false);};
  });
}
function endRound(w){
  S.over=true;S.busy=false;
  if(w===null){tally.d++;saveTally();setMsg('Draw — 나가리');render();
    openModal(`<h2>나가리 · Draw</h2><p>The cards ran out before anyone stopped, so nobody scores this round.</p><div class="btns"><button class="btn primary" id="bNext" type="button">Deal again</button></div>`);
    $('#bNext').onclick=newRound;return;}
  const l=1-w,ws=scoreOf(S.cap[w]),ls=scoreOf(S.cap[l]);
  const rows=ws.det.map(([a,b])=>`<div class="row"><span>${a}</span><span>${b}</span></div>`);
  let pts=ws.total;
  if(S.go[w]){pts+=S.go[w];rows.push(`<div class="row"><span>${S.go[w]} Go bonus</span><span>+${S.go[w]}</span></div>`);}
  if(S.go[w]>=3){const x=2**(S.go[w]-2);pts*=x;rows.push(`<div class="row"><span>${S.go[w]} Go multiplier</span><span>× ${x}</span></div>`);}
  if(ws.pp>0&&ls.pv>0&&ls.pv<=5){pts*=2;rows.push(`<div class="row"><span>피박 Pi-bak (loser has ≤5 junk)</span><span>× 2</span></div>`);}
  if(ws.gp>0&&ls.gc===0){pts*=2;rows.push(`<div class="row"><span>광박 Gwang-bak (loser has no brights)</span><span>× 2</span></div>`);}
  rows.push(`<div class="row total"><span>Total</span><span>${pts}</span></div>`);
  if(w===0){tally.you+=pts;tally.w++;FX.confetti();SND.chime();}else{tally.ai+=pts;tally.l++;}saveTally();
  setMsg(w===0?`You won ${pts} points`:`Opponent won ${pts} points`);render();
  openModal(`<h2>${w===0?'You win':'Opponent wins'}</h2><p class="sub">${w===0?'You called Stop.':'The opponent called Stop.'}</p><div class="rows">${rows.join('')}</div>
    <div class="btns"><button class="btn primary" id="bNext" type="button">Next round</button></div>`);
  $('#bNext').onclick=newRound;
}

/* ---------------- coach ---------------- */
const COACH={on:false,asked:false};
try{const v=localStorage.getItem('gostop-coach');COACH.on=v==='1';COACH.asked=v!==null;}catch(e){}
const ANIMAL={2:'bush warbler',4:'cuckoo',5:'bridge',6:'butterflies',7:'boar',8:'geese',9:'sake cup',10:'deer',12:'swallow'};
const RIBN={hong:'red poem ribbon (홍단)',cheong:'blue ribbon (청단)',cho:'plain red ribbon (초단)',plain:'rain ribbon'};
const DAN={hong:[1,2,3],cheong:[6,9,10],cho:[4,5,7]};
const DANK={hong:'홍단',cheong:'청단',cho:'초단'};
function label(c){const mo=MONTHS[c.m][1];
  if(c.t==='g')return `${mo} bright (光)`;if(c.t==='a')return `${mo} ${ANIMAL[c.m]}`;if(c.t==='r')return `${mo} ${RIBN[c.rib]}`;return `${mo} ${c.pv===2?'double junk (쌍피)':'junk'}`;}
const has=(cap,fn)=>cap.filter(id=>fn(CARD[id])).length;
// what a card does for the owner of `cap`: {v:bonus, txt}
function setValue(cap,c){
  if(c.t==='a'&&[2,4,8].includes(c.m)){const n=has(cap,x=>x.t==='a'&&[2,4,8].includes(x.m));return n===2?{v:9,txt:'completes 고도리 (Godori, +5)'}:{v:2+n*2,txt:`is Godori bird ${n+1} of 3`};}
  if(c.t==='r'&&DAN[c.rib]){const n=has(cap,x=>x.t==='r'&&x.rib===c.rib);return n===2?{v:8,txt:`completes ${DANK[c.rib]} (+3)`}:{v:1+n*2,txt:`is ${DANK[c.rib]} ribbon ${n+1} of 3`};}
  if(c.t==='g'){const n=has(cap,x=>x.t==='g');return n>=2?{v:8,txt:`gives you ${n+1} brights${n===2?' (that scores)':''}`}:{v:3,txt:`is bright ${n+1}; 3 brights score`};}
  if(c.t==='p'){const pv=has(cap,x=>x.t==='p')+has(cap,x=>x.pv===2);if(pv>=7&&pv<10)return {v:3,txt:`pushes your junk toward 10 (now ${pv})`};}
  return {v:0,txt:''};
}
function oppWants(c){const op=S.cap[1];
  if(c.t==='a'&&[2,4,8].includes(c.m))return has(op,x=>x.t==='a'&&[2,4,8].includes(x.m))>=2?'고도리':'';
  if(c.t==='r'&&DAN[c.rib])return has(op,x=>x.t==='r'&&x.rib===c.rib)>=2?DANK[c.rib]:'';
  if(c.t==='g')return has(op,x=>x.t==='g')>=2?'brights':'';
  return '';}
function coachTip(){
  const me=S.cap[0];let best=null;
  for(const id of S.hands[0]){const c=CARD[id],ms=S.table.filter(t=>CARD[t].m===c.m);let s,take=[];
    if(!ms.length){s=-val(c)*.6-(oppWants(c)?8:0);}
    else{take=ms.length===3?ms:[ms.reduce((a,b)=>val(CARD[b])>val(CARD[a])?b:a)];
      s=[id,...take].reduce((a,x)=>a+val(CARD[x])+setValue(me,CARD[x]).v+(oppWants(CARD[x])?5:0),0)+(ms.length===3?10:0);}
    // keep a pair in hand for later if one card of a pair has no match? small nudge: prefer cheap throwaways
    if(!best||s>best.s)best={id,s,ms,take};}
  const c=CARD[best.id];let h;
  if(best.ms.length){
    const t=best.take.map(x=>CARD[x]);
    h=`<p><b>Try the ${label(c)}.</b> `;
    if(best.ms.length===3)h+=`It takes the whole stuck stack of ${MONTHS[c.m][1]} and steals a junk card.`;
    else h+=`It pairs with the ${label(t[0])} on the table${best.ms.length===2?' (you’ll get to choose which one)':''}.`;
    const notes=[best.id,...best.take].map(x=>{const sv=setValue(me,CARD[x]);return sv.txt?`That ${CARD[x].t==='p'?'junk':CARD[x].t==='g'?'bright':CARD[x].t==='a'?'animal':'ribbon'} ${sv.txt}.`:'';}).filter(Boolean);
    if(notes.length)h+=' '+notes[0];
    const deny=[best.id,...best.take].map(x=>oppWants(CARD[x])).find(Boolean);
    if(deny)h+=` It also keeps the opponent from finishing ${deny}.`;
    h+='</p>';
  }else{
    h=`<p><b>Nothing matches.</b> Throw away the ${label(c)}: it’s ${val(c)<=3?'low value':'the least useful card you have'}${oppWants(c)?'':' and the opponent can’t use it for a set'}.</p>`;
  }
  return {id:best.id,html:h+(S.hands[0].length>=10?'<p class="ev first">Tap it twice to play. The card flipped from the pile afterwards is luck.</p>':'')};
}
function threats(){
  const op=S.cap[1],sc=scoreOf(op),w=[];
  if(sc.total>=4)w.push(`has ${sc.total} pts`);
  const gb=[2,4,8].filter(m=>!op.some(id=>CARD[id].t==='a'&&CARD[id].m===m));if(gb.length===1)w.push(`needs the ${MONTHS[gb[0]][1]} bird for 고도리`);
  for(const k in DAN){const miss=DAN[k].filter(m=>!op.some(id=>CARD[id].t==='r'&&CARD[id].m===m));if(miss.length===1)w.push(`needs the ${MONTHS[miss[0]][1]} ribbon for ${DANK[k]}`);}
  if(sc.gc===2)w.push('has 2 brights');
  return w.length?'Watch out, the opponent '+w.slice(0,2).join(' and ')+'.':'';
}
const WHY={'쪽':'Kiss (쪽): the played card had no partner, but the flipped card matched it, so both were taken and a junk card was stolen.',
  '뻑':'Stuck (뻑): one card was paired, but the flip was a third card of the same month, so all three stay on the table. Whoever plays the fourth card of that month takes them all, plus a junk card.',
  '따닥':'따닥: two table cards matched, and the flip was the fourth card of that month, so all four were taken, plus a junk card.',
  '싹쓸이':'The fourth card of a month took a stuck stack of three, plus a junk card.',
  '쓸':'Sweep (쓸): the table was cleared, which earns a stolen junk card.'};
function explainTurn(p,all,calls,stolen){
  const who=p===0?'You':'The opponent';
  const notable=all.map(x=>CARD[x]).filter(c=>c.t!=='p'||c.pv===2).map(label);
  let h=`<p class="ev">${who} ${all.length?`took ${all.length} cards${notable.length?`, including the ${notable[0]}`:''}`:'took nothing'}${stolen?` and stole ${stolen} junk`:''}.</p>`;
  for(const [k] of calls)h+=`<p class="ev">${WHY[k]}</p>`;
  return h;
}
function goAdvice(sc){
  const op=scoreOf(S.cap[1]).total,left=S.hands[0].length,w=threats();
  if(op>=4||left<=2||w.includes('needs'))return {go:false,text:`Stop. ${op>=4?`The opponent already has ${op} points`:left<=2?`You only have ${left} card${left>1?'s':''} left to improve with`:'The opponent is one card from a set'}, so going on is risky. ${sc} points in the bank is a good result.`};
  return {go:true,text:`Go looks fairly safe. The opponent has only ${op} point${op===1?'':'s'} and you still have ${left} cards to score with. Remember: after a Go you can only stop once your score rises.`};
}
function setCoach(on){COACH.on=on;COACH.asked=true;try{localStorage.setItem('gostop-coach',on?'1':'0');}catch(e){}
  const b=$('#btnCoach');b.setAttribute('aria-pressed',on);b.textContent=on?'Coach on':'Coach';if(S){if(!on&&S.cont)S.cont();render();}}
$('#btnCoach').onclick=()=>setCoach(!COACH.on);
function askCoach(){openModal(`<h2>Want a coach?</h2><p>The coach suggests a card each turn and explains why, explains special moves after they happen, warns you when the opponent is close to a set, and advises on Go or Stop.</p><p class="sub">You can switch it on or off at any time with the Coach button.</p>
  <div class="btns"><button class="btn" id="bNoCoach" type="button">No thanks</button><button class="btn primary" id="bYesCoach" type="button">Yes, coach me</button></div>`);
  $('#bYesCoach').onclick=()=>{closeModal();setCoach(true);};$('#bNoCoach').onclick=()=>{closeModal();setCoach(false);};}

/* ---------------- input ---------------- */
function onCard(el){
  const id=el.dataset.id;if(!id||!S)return;
  if(S.choosing){if(S.choosing.ids.includes(id)){const r=S.choosing.resolve;S.choosing=null;r(id);}return;}
  if(S.turn!==0||S.busy||S.over)return;
  if(el.closest('#hand')){if(S.sel===id){playTurn(0,id);}else{S.sel=id;setMsg(`${MONTHS[CARD[id].m][0]} · ${MONTHS[CARD[id].m][1]} — tap again to play`);render();}}
  else if(el.closest('#groups')&&S.sel&&CARD[S.sel].m===CARD[id].m){playTurn(0,S.sel);}
}
$('#app').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)onCard(c);});
$('#app').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();onCard(e.target);}});
$('#btnNew').onclick=()=>{if(S&&S.busy&&!S.over&&!S.choosing)return;newRound();};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&$('#panel').dataset.dismiss)closeModal();});
$('#btnRules').onclick=showRules;
const sb=$('#btnSound');const syncSound=()=>{sb.setAttribute('aria-pressed',SND.on);sb.style.opacity=SND.on?1:.45;sb.title=SND.on?'Sound on':'Sound off';};syncSound();
sb.onclick=()=>{SND.toggle();syncSound();};
document.addEventListener('pointerdown',()=>SND.unlock(),{once:true});
const hand=$('#hand');
hand.addEventListener('mouseover',e=>{const c=e.target.closest('.card');if(!c||!S||S.turn!==0||S.busy||S.over||S.sel)return;const m=CARD[c.dataset.id].m;
  document.querySelectorAll('#groups .card').forEach(t=>t.classList.toggle('match',CARD[t.dataset.id].m===m));});
hand.addEventListener('mouseleave',()=>{if(S&&!S.sel)document.querySelectorAll('#groups .card.match').forEach(t=>t.classList.remove('match'));});
(()=>{const cols=['#b8352a','#e6d8b8','#3f7a52','#d9a640','#2f5a92','#7a4a86','#a8241d','#c9603a'];let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  let blocks='';for(let y=0;y<54;y+=9){let x=0;while(x<54){const w=Math.min(54-x,6+Math.floor(rnd()*4)*4);const c=cols[Math.floor(rnd()*cols.length)];
    blocks+=`<rect x="${x}" y="${y}" width="${w}" height="9" fill="${c}"/><rect x="${x+1.2}" y="${y+1.2}" width="${Math.max(0,w-2.4)}" height="6.6" fill="none" stroke="#f7f0dd" stroke-opacity=".5" stroke-width=".6" stroke-dasharray="1.6 1.3"/>`;x+=w;}}
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="54" height="54">${blocks}</svg>`;
  document.documentElement.style.setProperty('--bojagi',`url("data:image/svg+xml,${encodeURIComponent(svg)}")`);})();

function showRules(){
  const guide=Object.keys(MONTHS).map(m=>`<div class="gm"><div class="nm"><b>${m}월 ${MONTHS[m][0]}</b>${MONTHS[m][1]}</div><div class="cs">${ALL.filter(id=>CARD[id].m==m).map(id=>cardHTML(id,true)).join('')}</div></div>`).join('');
  openModal(`<h2>How to play Go-Stop</h2>
  <p class="sub">Two-player Go-Stop (맞고) against the computer. Each player gets 10 cards, 8 go face up on the table, and the rest form the draw pile.</p>
  <h3>Your turn</h3>
  <ul><li>Play a card from your hand. If a table card shares its month, you pair them.</li>
  <li>Then the top card of the pile is flipped and pairs the same way.</li>
  <li>Paired cards go to your pile. Unmatched cards stay on the table.</li>
  <li>If two table cards match, you pick which one to take.</li></ul>
  <h3>Special moves</h3>
  <table class="score">
  <tr><td><b>쪽</b> Kiss: your played card had no match, and the flipped card pairs with it</td><td>steal 1 피</td></tr>
  <tr><td><b>뻑</b> Stuck: you pair a card, then flip the 3rd of that month. All three stay on the table</td><td>—</td></tr>
  <tr><td><b>따닥</b> You pair with one of two, and the flip is the 4th of the month</td><td>take all 4, steal 1</td></tr>
  <tr><td><b>싹쓸이</b> Take a stuck stack of three with the 4th card</td><td>steal 1 피</td></tr>
  <tr><td><b>쓸</b> Sweep: you clear the table</td><td>steal 1 피</td></tr>
  </table>
  <h3>Scoring</h3>
  <table class="score">
  <tr><td>3 brights 광 (2 if one is the rain bright)</td><td>3</td></tr>
  <tr><td>4 brights / 5 brights</td><td>4 / 15</td></tr>
  <tr><td>5 animals 열끗, +1 each extra</td><td>1+</td></tr>
  <tr><td>고도리 Godori: the three bird animals (Feb, Apr, Aug)</td><td>5</td></tr>
  <tr><td>5 ribbons 띠, +1 each extra</td><td>1+</td></tr>
  <tr><td>홍단 red poem ribbons (Jan, Feb, Mar)</td><td>3</td></tr>
  <tr><td>청단 blue ribbons (Jun, Sep, Oct)</td><td>3</td></tr>
  <tr><td>초단 plain red ribbons (Apr, May, Jul)</td><td>3</td></tr>
  <tr><td>10 junk 피, +1 each extra (쌍피 counts as 2)</td><td>1+</td></tr>
  </table>
  <h3>Go or Stop</h3>
  <p>At 7 points you choose. <b>Stop</b> ends the round and you collect. <b>Go</b> adds +1 per Go, and 3 or more Gos double the total. After a Go you can only stop again once your score has gone up. If nobody stops before the cards run out, the round is a draw (나가리).</p>
  <p>The winner's total doubles for <b>피박</b> (the loser has 1–5 junk) and <b>광박</b> (the winner scored brights and the loser has none). Shaking, bombs and bonus cards are left out.</p>
  <label class="toggle"><input type="checkbox" id="hintT" ${document.body.classList.contains('hints')?'checked':''}> Show month numbers and match dots on cards</label>
  <label class="toggle"><input type="checkbox" id="coachT" ${COACH.on?'checked':''}> Coach mode: card suggestions and explanations</label>
  <h3>The 48 cards</h3>
  <p class="sub">Each row is one month: bright or animal, ribbon, then junk. 光 marks a bright and 쌍피 a double junk.</p>
  <div class="guide">${guide}</div>
  <div class="btns"><button class="btn primary" id="bClose" type="button">Back to the game</button></div>`,true);
  $('#panel').dataset.dismiss='1';
  $('#bClose').onclick=()=>{$('#panel').dataset.dismiss='';closeModal();};
  $('#coachT').onchange=e=>setCoach(e.target.checked);
  $('#hintT').onchange=e=>{document.body.classList.toggle('hints',e.target.checked);try{localStorage.setItem('gostop-hints',e.target.checked?'1':'0');}catch(_){}};
}

/* ---------------- persistence across republish ---------------- */
let stable=null;
function snapshot(){if(S&&!S.busy&&!S.choosing){stable={hands:S.hands,cap:S.cap,table:S.table,deck:S.deck,turn:S.turn,go:S.go,goAt:S.goAt,over:S.over};}}
try{window.claude?.hot?.snapshot?.(()=>stable?JSON.parse(JSON.stringify(stable)):{});}catch(e){}
function start(data){
  if(data&&data.hands&&data.deck&&!data.over){
    S=Object.assign(blank(),data);
    setMsg(S.turn===0?'Your turn — tap a card, then tap it again to play':'Opponent is thinking…',S.turn===1);
    render();if(S.turn===1){S.busy=false;aiTurn();}
  }else newRound();
}
addEventListener('resize',()=>layoutCaps());
{const b=$('#btnCoach');b.setAttribute('aria-pressed',COACH.on);b.textContent=COACH.on?'Coach on':'Coach';}
const boot0=()=>window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
const boot=()=>{boot0();if(!COACH.asked)setTimeout(()=>{if($('#modal').hidden)askCoach();},1400);};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(boot,boot);
})();
</script>
